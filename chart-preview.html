<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الشارت — GOLDEN RATIO (تجربة)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0B0C28;--bg2:#10123A;--panel:#141748;--line:#262A66;--fg:#EEF0FF;--muted:#9EA3D6;--gold:#F2B705;--up:#3DD68C;--down:#FF6B6B;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Readex Pro",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px rgba(242,183,5,.55)}
.top b{font-family:Montserrat,sans-serif;letter-spacing:.5px}
.px{margin-inline-start:auto;text-align:left;font-family:Montserrat,sans-serif;font-size:22px;font-weight:700;direction:ltr}
.px small{display:block;font-size:12px;font-weight:600}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.bar button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.bar button.on{background:var(--gold);color:#1A1300;border-color:var(--gold);font-weight:700}
.bar .sp{flex:1}
.card{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
#ch{height:62vh;min-height:360px}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.06}
.wm img{width:46%;max-width:300px}
.lock{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(11,12,40,.96) 35%);text-align:center}
.lock a{display:inline-block;margin-top:8px;background:var(--gold);color:#1A1300;font-weight:700;text-decoration:none;padding:10px 18px;border-radius:12px}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.mode{font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="icon-512.png" alt="">
    <div><b>GOLDEN RATIO</b><div style="font-size:13px;color:var(--muted)">📈 الشارت · XAUUSD</div></div>
    <div class="px" id="px">—<small id="chg"></small></div>
  </div>
  <div class="bar" id="tfs"></div>
  <div class="bar">
    <button id="bMA" class="on">📏 المتوسطات</button>
    <button id="bLv" class="on">🎯 التوصيات والمناطق</button>
    <span class="sp"></span>
    <button id="bMode" class="mode">👁️ عرض الزائر</button>
  </div>
  <div class="card">
    <div id="ch"></div>
    <div class="wm"><img src="icon-512.png" alt=""></div>
    <div class="lock" id="lock" hidden>🔒 <b>التوصية والمناطق للمشتركين بس</b><div style="font-size:13px;color:var(--muted)">اشترك وشوف الدخول والوقف والأهداف على الشارت لايف</div><a href="./#sub">اشترك الحين 👑</a></div>
  </div>
  <div class="leg" id="leg"></div>
  <div class="note">نسخة تجربة — الشموع حالياً من مصدر لايف مضبوط على سعر OANDA، وبالنسخة النهائية تجي من البوت مباشرة</div>
</div>
<script>
const SB = "https://vrimrmltlmmwapxpvgeh.supabase.co/functions/v1/gold-price";
// 🧪 بيانات التجربة: نفس اللي بالبانل الحين
const LV = {
  sig: { side: "sell", lo: 4033.60, hi: 4034.81, sl: 4066.84, tps: [4024.21, 4014.21, 4003.04, 3991.84, 3980.65], note: "بيع 7/10 — ينتظر صيد 4051.84" },
  ideas: [{ side: "buy", lo: 3989.08, hi: 4020.62, tf: "H4" }],
  fire: [{ p: 4051.84, t: "🔥 أقوى مقاومة" }, { p: 3955.00, t: "🔥 أقوى دعم" }],
};
const TFS = [["15m", "M15", 15], ["1h", "H1", 60], ["4h", "H4", 240], ["1d", "يومي", 1440]];
let tf = "15m", member = true, showMA = true, showLv = true, off = 0, last = null, ma = [];
const el = document.getElementById("ch");
const chart = LightweightCharts.createChart(el, {
  layout: { background: { color: "transparent" }, textColor: "#9EA3D6", fontFamily: "Montserrat, sans-serif" },
  grid: { vertLines: { color: "rgba(38,42,102,.45)" }, horzLines: { color: "rgba(38,42,102,.45)" } },
  rightPriceScale: { borderColor: "#262A66" }, timeScale: { borderColor: "#262A66", timeVisible: true, rightOffset: 8 },
  crosshair: { mode: 0 }, localization: { locale: "en-US", priceFormatter: p => p.toFixed(2) },
});
const cs = chart.addCandlestickSeries({ upColor: "#3DD68C", downColor: "#FF6B6B", borderVisible: false, wickUpColor: "#3DD68C", wickDownColor: "#FF6B6B" });
const MAS = [[200, "#4EA8FF"], [370, "#F2B705"], [500, "#E7E9FF"]].map(([n, c]) => ({ n, s: chart.addLineSeries({ color: c, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }) }));
const zoneS = []; let lines = [];
new ResizeObserver(() => chart.applyOptions({ width: el.clientWidth, height: el.clientHeight })).observe(el);

async function oanda() { try { const j = await (await fetch(SB)).json(); return j; } catch (_) { return null; } }
async function klines(iv, n) {
  for (const host of ["https://api.binance.com", "https://data-api.binance.vision"]) {
    try { const r = await fetch(host + "/api/v3/klines?symbol=PAXGUSDT&interval=" + iv + "&limit=" + n); if (r.ok) return await r.json(); } catch (_) {}
  }
  return [];
}
const toC = k => ({ time: Math.floor(k[0] / 1000) + 3 * 3600, open: +k[1] + off, high: +k[2] + off, low: +k[3] + off, close: +k[4] + off });
function sma(d, n) { const o = []; let s = 0; d.forEach((c, i) => { s += c.close; if (i >= n) s -= d[i - n].close; if (i >= n - 1) o.push({ time: c.time, value: s / n }); }); return o; }

function clearLv() { lines.forEach(l => cs.removePriceLine(l)); lines = []; zoneS.forEach(z => chart.removeSeries(z)); zoneS.length = 0; }
function pl(price, color, title, style, w) { lines.push(cs.createPriceLine({ price, color, title, lineWidth: w || 1, lineStyle: style ?? 2, axisLabelVisible: true })); }
function zone(lo, hi, color, data) {
  // منطقة مظللة: سلسلة منطقة بين حدين
  const a = chart.addBaselineSeries({ baseValue: { type: "price", price: lo }, topFillColor1: color, topFillColor2: color, topLineColor: "transparent", bottomLineColor: "transparent", bottomFillColor1: "transparent", bottomFillColor2: "transparent", priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  a.setData(data.map(c => ({ time: c.time, value: hi }))); zoneS.push(a);
}
function drawLv(data) {
  clearLv();
  if (!showLv || !member || !data.length) return;
  const recent = data.slice(-Math.min(data.length, 60));
  LV.ideas.forEach(z => { zone(z.lo, z.hi, z.side === "buy" ? "rgba(61,214,140,.16)" : "rgba(255,107,107,.16)", recent); pl(z.hi, z.side === "buy" ? "#3DD68C" : "#FF6B6B", "🔭 فكرة " + (z.side === "buy" ? "شراء " : "بيع ") + z.tf, 1, 1); });
  const s = LV.sig, sell = s.side === "sell";
  zone(s.lo, s.hi, "rgba(242,183,5,.25)", recent.slice(-20));
  pl((s.lo + s.hi) / 2, "#F2B705", (sell ? "🔴 بيع " : "🟢 شراء ") + "دخول", 0, 2);
  pl(s.sl, "#FF6B6B", "🛑 وقف", 0, 2);
  s.tps.forEach((t, i) => pl(t, "#3DD68C", "🎯 " + (i + 1), 2, 1));
  LV.fire.forEach(f => pl(f.p, "#FF9F43", f.t, 3, 1));
}
function legend() {
  const L = document.getElementById("leg"); L.innerHTML = "";
  const add = (c, t) => { const s = document.createElement("span"); s.innerHTML = '<i style="background:' + c + '"></i>' + t; L.append(s); };
  if (showMA) { add("#4EA8FF", "MA200"); add("#F2B705", "MA370"); add("#E7E9FF", "MA500"); }
  if (showLv && member) { add("#F2B705", "الدخول"); add("#FF6B6B", "الوقف"); add("#3DD68C", "الأهداف"); add("#FF9F43", "🔥 أقوى مناطق"); add("rgba(61,214,140,.6)", "منطقة الفكرة"); }
}
let data = [];
async function load() {
  const [q, k] = await Promise.all([oanda(), klines(tf, 1000)]);
  if (!k.length) return;
  if (q && q.price) off = q.price - +k[k.length - 1][4];
  data = k.map(toC); cs.setData(data);
  MAS.forEach(m => m.s.setData(showMA && tf === "15m" ? sma(data, m.n) : []));
  drawLv(data); legend(); px(q);
  chart.timeScale().setVisibleLogicalRange({ from: data.length - 120, to: data.length + 6 });
}
function px(q) {
  const c = data[data.length - 1]; if (!c) return;
  document.getElementById("px").firstChild.nodeValue = c.close.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (q && q.change != null) { const g = document.getElementById("chg"); g.textContent = (q.change >= 0 ? "▲ +" : "▼ ") + q.change.toFixed(2) + " (" + q.changePct.toFixed(2) + "%)"; g.style.color = q.change >= 0 ? "var(--up)" : "var(--down)"; }
}
async function tick() {
  const k = await klines(tf, 2); if (!k.length) return;
  const c = toC(k[k.length - 1]); cs.update(c);
  if (data.length && data[data.length - 1].time === c.time) data[data.length - 1] = c; else data.push(c);
  px(null);
}
setInterval(tick, 2000);
setInterval(async () => { const q = await oanda(); if (q && q.price && data.length) { off += q.price - data[data.length - 1].close; px(q); } }, 15000);

const T = document.getElementById("tfs");
TFS.forEach(([v, n, m]) => { const b = document.createElement("button"); b.textContent = n; if (v === tf) b.className = "on"; b.onclick = () => { tf = v; [...T.children].forEach(x => x.classList.toggle("on", x === b)); load(); }; T.append(b); });
const tg = (id, f) => document.getElementById(id).onclick = e => { f(); e.currentTarget.classList.toggle("on"); load(); };
tg("bMA", () => showMA = !showMA);
tg("bLv", () => showLv = !showLv);
document.getElementById("bMode").onclick = e => { member = !member; e.currentTarget.textContent = member ? "👁️ عرض الزائر" : "👑 عرض المشترك"; document.getElementById("lock").hidden = member; drawLv(data); legend(); };
load();
</script>
</body>
</html>
