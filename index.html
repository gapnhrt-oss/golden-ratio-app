<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLDEN RATIO</title>
<meta name="theme-color" content="#0B0C28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golden Ratio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B0C28;--bg2:#10123A;--panel:#141748;--line:#262A66;
  --fg:#EEF0FF;--muted:#9EA3D6;--gold:#F2B705;--gold2:#C67F0B;--ink:#1A1300;
  --up:#3DD68C;--down:#FF6B6B;--wa:#25D366;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --latin:"Montserrat","Readex Pro",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-family:var(--latin);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.pos{color:var(--up)}.neg{color:var(--down)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:8px;direction:ltr;text-decoration:none}
.brand img{width:34px;height:34px}
.brand b{font-family:var(--latin);font-weight:800;letter-spacing:.02em}
.brand span{font-family:var(--latin);font-weight:300}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}

/* tabs */
.tabs{position:fixed;inset:auto 0 0 0;z-index:10;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500;position:relative}
.tabs a[aria-current="page"]{color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dotbadge{position:absolute;top:4px;inset-inline-end:calc(50% - 18px);min-width:16px;height:16px;border-radius:999px;background:var(--down);color:#fff;font:700 .65rem var(--latin);display:grid;place-items:center;padding:0 4px}

main{padding:18px 0 24px}
.screen{display:flex;flex-direction:column;gap:16px}
.h1{font-size:1.5rem;font-weight:700}
.h2{font-size:1.1rem;font-weight:600}
.eyebrow{font-family:var(--latin);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.gold{border-color:var(--gold2);background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 13%,var(--bg2)),var(--bg2))}
.card.soft{background:var(--bg2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.green{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up);border:1px solid color-mix(in srgb,var(--up) 40%,transparent)}
.btn.red{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down);border:1px solid color-mix(in srgb,var(--down) 40%,transparent)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

label{font-size:.85rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px}
.pill.buy,.pill.on{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.pill.sell,.pill.off{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.pill.wait{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.pill.gray{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}

/* signal card */
.sig{background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sig.open{border-color:var(--gold2)}
.online{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.online i{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px color-mix(in srgb,var(--up) 22%,transparent)}
.online b{color:var(--gold);font-family:var(--latin);font-size:1rem}
.tv{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg2);min-height:60px}
.tv .tradingview-widget-copyright{display:none}
.tv iframe{color-scheme:light}
.tv.price{background:linear-gradient(180deg,#141a4a,#0d1238);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.cal-day{position:sticky;top:64px;z-index:3;display:flex;align-items:center;gap:10px;font-size:1rem;margin:18px 0 2px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));color:var(--fg);box-shadow:0 6px 14px -8px #000}
.cal-day::before{content:"📅"}
.cal-day.today{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);border-color:var(--gold)}
.cal-day.today::before{content:"⭐"}
.cal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;border-inline-start:4px solid var(--line)}
.cal.up{border-inline-start-color:var(--up)}.cal.dn{border-inline-start-color:var(--down)}
.cal-h{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.cal-t{color:var(--muted);font-size:.85rem}.cal-f{font-size:1.2rem}
.cal-n b{display:block;font-size:.95rem;line-height:1.35}.cal-n small{color:var(--muted);font-size:.72rem}
.imp{display:inline-flex;align-items:flex-end;gap:2px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.imp i{width:4px;border-radius:2px;background:currentColor;opacity:.25}.imp i:nth-child(1){height:6px}.imp i:nth-child(2){height:9px}.imp i:nth-child(3){height:12px;margin-inline-end:4px}
.imp.hi{color:#FF4D5E;background:color-mix(in srgb,#FF4D5E 16%,transparent)}.imp.hi i{opacity:1}
.imp.mid{color:#FF9F1C;background:color-mix(in srgb,#FF9F1C 15%,transparent)}.imp.mid i:nth-child(-n+2){opacity:1}
.imp.lo{color:#F2D21B;background:color-mix(in srgb,#F2D21B 13%,transparent)}.imp.lo i:nth-child(1){opacity:1}
.cal-v{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.cal-v div{background:var(--bg);border-radius:10px;padding:6px 4px}.cal-v small{display:block;color:var(--muted);font-size:.72rem}
.cal-v b{font-size:1rem}.cal-v b.big{font-size:1.25rem}
.cal-v b.up,.cal-r.up b{color:var(--up)}.cal-v b.dn,.cal-r.dn b{color:var(--down)}
.cal-r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem;padding:6px 10px;border-radius:10px}
.cal-r.up{background:color-mix(in srgb,var(--up) 13%,transparent)}.cal-r.dn{background:color-mix(in srgb,var(--down) 13%,transparent)}.cal-r.eq{background:color-mix(in srgb,var(--muted) 12%,transparent)}
.cal-r span{color:var(--muted)}
.cal-r.soon{background:color-mix(in srgb,#FF4D5E 10%,transparent)}.cal-r.soon b{color:#FF4D5E}
.newsalert{display:grid;gap:8px;text-decoration:none;color:var(--fg);border-color:color-mix(in srgb,#FF4D5E 35%,var(--line))}
.newsalert.res{border-color:var(--line)}.newsalert.res.up{border-color:var(--up)}.newsalert.res.dn{border-color:var(--down)}
.newsalert.near{border-color:#FF4D5E;background:color-mix(in srgb,#FF4D5E 8%,var(--bg2))}
.news{display:grid;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--fg)}
.news b{font-size:1rem;line-height:1.55}.news .en{color:var(--muted);font-size:.75rem;line-height:1.4}
.tv.price{max-height:84px}
.views{font-size:.78rem;color:var(--muted);font-family:var(--latin)}
.sig-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sig-h .pair{font-family:var(--latin);font-weight:800;direction:ltr}
.sig-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.levels{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.levels dt{color:var(--muted)}
.levels dd{margin:0;text-align:end}
.sig img.chart{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.timeline{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.tl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:7px}
.tl small{color:var(--muted);font-size:.75rem}
.strength{display:inline-flex;gap:2px}
.strength b{width:6px;height:12px;border-radius:2px;background:var(--line)}
.strength b.f{background:var(--gold)}

.teaser{display:flex;align-items:center;gap:12px}
.ring{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 60%,transparent);animation:ring 1.8s infinite;flex:none}
@keyframes ring{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.blur{filter:blur(5px);user-select:none}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;min-height:50vh}
.bubble{max-width:80%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-start;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);border-end-start-radius:4px}
.bubble.them{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-end-end-radius:4px}
.bubble small{display:block;font-size:.68rem;opacity:.7;margin-top:2px}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.composer textarea{min-height:46px;height:46px}

.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
code.copy{display:block;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;font-family:var(--latin);direction:ltr;text-align:left;overflow-wrap:anywhere;user-select:all}

.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}

.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--up);color:#04210F;font-weight:600;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--down);color:#2A0505}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,6,20,.75);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--gold2);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.install{display:flex;gap:10px;align-items:center}
.install img{width:44px;height:44px;border-radius:10px}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

/* ================== التحديث اللحظي والتنبيهات ================== */
let channel = null;
function notify(title, body, url) {
  toast(title);
  if (!("Notification" in window) || Notification.permission !== "granted" || !document.hidden) return;
  navigator.serviceWorker && navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, icon: "icon-512.png", badge: "icon-512.png", data: { url } })).catch(() => {});
}
function subscribeLive() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("live")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "signals" }, p => { notify(S.member ? "توصية جديدة 📈" : "توصية جديدة للمشتركين", "افتح التطبيق", "./#signals"); refreshIf("home", "signals"); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "signals" }, () => refreshIf("home", "signals"))
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "signal_updates" }, p => { notify("تحديث على التوصية: " + (KIND[p.new.kind] || ""), p.new.body || "", "./#signals"); refreshIf("signals"); })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" }, () => { notify("منشور جديد", "", "./#home"); refreshIf("home"); })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, p => {
      const mine = S.session && p.new.sender === S.session.user.id;
      if (!mine) { if (S.route !== "chat" && !S.admin) { S.unread++; renderChrome(); } notify("رسالة جديدة 💬", p.new.body, S.admin ? "./#admin/msgs/" + p.new.thread_user : "./#chat"); }
      refreshIf("chat"); if (S.admin && S.route === "admin" && location.hash.startsWith("#admin/msgs")) route();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "subscriptions" }, async p => {
      if (S.admin && p.eventType === "INSERT") { notify("طلب اشتراك جديد 💳", "", "./#admin/req"); if (S.route === "admin") route(); return; }
      if (!S.admin && p.new && p.new.status === "active") { await loadUser(); notify("تفعّل اشتراكك 🎉", "", "./#signals"); route(); }
      else if (!S.admin && p.new && p.new.status === "rejected") { toast("طلبك ما انقبل، شوف اشتراكي", true); refreshIf("sub"); }
    })
    .subscribe();
}
