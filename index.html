rap([["⚡","سكالبينج","دقايق","لين ساعة","M5 · M15","180,140,255","#B48CFF","#E2D6FF"],["🎯","داي تريد","ساعات","لين يوم","M15 · H1 · H4","242,183,5","#F2B705","#FFD54A"],["💼","استثمار","أيام","لين أسابيع","D1 · W1","61,214,140","#3DD68C","#7FF0C0"],["🤖","اكسبيرت","آلي","طول الأسبوع","حساب حقيقي","78,168,255","#4EA8FF","#9FCBFF"]].map(([t,e,s,n,l,a,i,r],c)=>{const o=272-c*88,d=o+41;return LBox(o,14,82,150,"rgba("+a+",.14)",i)+LG.tx(d,44,t,"#fff",20)+LG.tx(d,72,e,r,12)+LG.tx(d,96,s,LG.txt,10)+LG.tx(d,110,n,LG.txt,10)+LG.tx(d,140,l,i,10)}).join("")+LG.ln(20,184,340,184,LG.txt,"4 4")+LG.tx(336,196,"⚡ أسرع",LG.txt,10,"end")+LG.tx(24,196,"أطول 💼",LG.txt,10,"start")),sec:[["🤔 شنو الفرق؟","نفس المحلل ونفس الطريقة، بس كل قسم يشتغل على فريمات غير ومدة صفقة غير. ⚡ السكالبينج: صفقات سريعة (دقايق لين ساعة) وأهداف قريبة. 🎯 الداي تريد: التوصية العادية، تمسك من ساعات لين يوم أو يومين. 💼 الاستثمار: صفقات طويلة على اليومي والأسبوعي، أهدافها بعيدة ووقفها أوسع. 🤖 الاكسبيرت: روبوت يتداول بحساب حقيقي وتشوف نتيجته بالدولار."],["🎯 أيهم يناسبني؟","إذا عندك وقت تتابع الشاشة وتحب السرعة → السكالبينج. إذا تبي توصيات واضحة وتتابعها كم مرة باليوم → الداي تريد. إذا مشغول وتبي صفقات قليلة وهادية → الاستثمار. وتقدر تتابع أكثر من قسم بنفس الاشتراك."],["🏷️ شلون أعرف القسم؟","كل توصية مكتوب عليها نوعها: على الصورة تحت «شراء/بيع الذهب»، وعلى الكرت بالموقع، وبأول سطر بالرسالة: «سكالبينج · توصية سريعة» أو «داي تريد · توصية يومية» أو «استثمار · توصية طويلة»."],["⚠️ انتبه","لا تعامل كل الأقسام بنفس اللوت. السكالبينج سريع ويتحرك بسرعة، والاستثمار وقفه أبعد — فخل حجم صفقتك يناسب الوقف (استخدم 🧮 حاسبة اللوت)."]],go:["#chart","📈 شوف الأقسام بصفحة التوصيات"],q:["أنت مشغول طول اليوم وتبي صفقات قليلة وهادية. أي قسم يناسبك أكثر؟",["💼 الاستثمار","⚡ السكالبينج","ما في فرق"],0]},{id:"o-card",ic:"🧾",t:"قراءة التوصية",sub:"الدخول · الوقف · الأهداف الخمسة · الشارات",lvl:1,svg:()=>LG.wrap('<rect x="150" y="34" width="200" height="86" fill="rgba(61,214,140,.16)"/><rect x="150" y="120" width="200" height="40" fill="rgba(255,107,107,.16)"/>'+LG.pl("10,150 40,138 70,146 100,128 130,124 150,120")+LG.dot(150,120)+LG.ln(150,120,350,120,LG.gold,"",2)+LG.ln(150,160,350,160,LG.dn,"",2)+[104,88,70,52,34].map((t,e)=>LG.ln(150,t,350,t,LG.up,"5 4")+LG.tx(345,t-4,"🎯 هدف "+(e+1),LG.up,10,"end")).join("")+LG.tx(345,116,"📍 الدخول",LG.gold,10,"end")+LG.tx(345,174,"🛑 الوقف",LG.dn,10,"end")+LG.pill(70,26,"🟢 شراء الذهب","#3DD68C")+LG.pill(70,52,"🎯 داي تريد · يومية",LG.g2)),sec:[["📍 الدخول","السعر اللي تدخل عنده. أحياناً يكون منطقة (من–إلى): ادخل وأنت داخلها، ولا تلاحق السعر إذا طلع بعيد عنها."],["🛑 الوقف","السعر اللي لو وصله نطلع بخسارة صغيرة محسوبة. الوقف جزء من الخطة، مو فشل — بدونه خسارة وحدة ممكن تمسح ربح أسبوع."],["🎯 الأهداف الخمسة","من القريب للبعيد. الهدف 1 أسهل واحد ويتحقق كثير، والأهداف البعيدة للحركات القوية. أول ما يتحقق الهدف 1 الوقف ينقل للدخول (يعني الصفقة صارت بأمان)."],["🏷️ الشارات","شراء 🟢 أو بيع 🔴 · نوع القسم (سكالبينج / داي تريد / استثمار) · القوة من 10 · وأحياناً «تأكيدات» توضّح ليش التوصية قوية."],["🖼️ الصورة تتحدّث","مع كل هدف يتحقق تطلع صورة جديدة فيها ✅ على الأهداف اللي تحققت ووين صار الوقف، وبالنهاية صورة «انتهت التوصية» فيها الحساب كامل."]],go:["#chart","📈 شوف التوصيات الحين"],q:["تحقق الهدف 1. وين يصير الوقف عادةً؟",["على سعر الدخول (بدون خسارة)","يظل مكانه","ننسحب من الصفقة كلها"],0]},{id:"o-entry",ic:"🔔",t:"متى تطلع «ادخل الآن»؟",sub:"التوصية تتجهز ← الشروط ✅ ← ادخل",lvl:2,svg:()=>LG.wrap(LBox(130,10,222,180,"rgba(255,255,255,.04)","rgba(255,255,255,.12)")+[["الاتجاه الكبير معنا",1],["السعر وصل المنطقة",1],["شمعة تأكيد بالمنطقة",1],["الزخم بدا يأكد",0],["ما في خبر قوي قريب",1]].map(([t,e],s)=>LG.tx(338,40+s*30,(e?"✅ ":"⏳ ")+t,e?LG.up:LG.gold,11,"end")).join("")+LG.ln(124,100,98,100,LG.gold,"",2)+'<path d="M98,94 L88,100 L98,106 Z" fill="#FFD54A"/>'+LBox(8,66,76,68,"rgba(61,214,140,.18)","#3DD68C")+LG.tx(46,94,"🔔","#fff",18)+LG.tx(46,118,"ادخل الآن",LG.up,11)),sec:[["🤔 شنو يصير قبل التوصية؟","المحلل يلقى فرصة (منطقة قوية + سبب واضح)، فتطلع لك «توصية تتجهز ⏳» بالموقع. هذي مو دخول — هذي يعني «انتبه، فيه شي قاعد يتكوّن»."],["✅ الشروط","قبل «ادخل الآن» لازم تكتمل كم شي: الاتجاه على الفريمات الكبيرة معنا (أو بدا يتعدل لجهتنا) · السعر وصل المنطقة · شمعة تأكيد داخل المنطقة · الزخم بدا يمشي معنا · وما في خبر قوي على الأبواب. وفيه بعد تقييم جاهزية من عدة بنود لازم يعدّي الحد."],["👀 شلون أتابعها؟","بكرت «التوصية تتجهز» تشوف كل شرط ✅ أو ⏳. أول ما تكتمل توصلك «🔔 ادخل الآن» بإشعار وواتساب. أحياناً السعر يطلع بدون ما تكتمل الشروط — وهذا عادي، ما نلاحق السعر."],["⚠️ انتبه","لا تدخل وانت تشوف ⏳. الشرط الناقص غالباً هو اللي يحميك من الدخلة الغلط. صفقة فاتتك أحسن من صفقة خسرتك."]],go:["#chart","📈 شوف التوصية اللي تتجهز"],q:["كرت «التوصية تتجهز» فيه 8 ✅ وواحد ⏳. شنو تسوي؟",["أنتظر لين توصل «ادخل الآن»","أدخل على طول","أعكس الصفقة"],0]},{id:"o-manage",ic:"🛡️",t:"إدارة الصفقة والوقف المتحرك",sub:"شلون الوقف يلحق الأهداف ويحمي ربحك",lvl:2,full:1,svg:t=>LG.wrap([150,120,96,72,48].map((e,s)=>LG.ln(10,e,350,e,s?LG.up:LG.gold,s?"5 4":"",s?1.2:2)+LG.tx(345,e-4,s?"🎯 "+s:"📍 الدخول",s?LG.up:LG.gold,10,"end")).join("")+LG.ln(10,178,120,178,LG.dn,"",2.2)+LG.tx(20,192,"🛑 الوقف الأصلي",LG.dn,10,"start")+LG.pl("10,150 50,140 90,118 120,122 150,96 180,100 210,72"+(t?" 240,80 270,62 300,48 330,56 350,40":""))+'<polyline points="120,178 120,150 240,150'+(t?" 240,120 300,120 300,96 350,96":"")+'" fill="none" stroke="#FF6B6B" stroke-width="2.4" stroke-dasharray="6 3"/>'+LG.pill(160,164,"الوقف ينقل للدخول",LG.dn)+(t?LG.pill(300,140,"الوقف يلحق الأهداف ⬆️",LG.dn):"")),sec:[["🤔 شنو الفكرة؟","الصفقة تنقسم: جزء نسكّره على الهدف الأول (نثبت ربح)، والباقي نخليه يكمل للأهداف البعيدة. وكل ما تحقق هدف، الوقف يتقدم خطوة ورا السعر."],["🪜 خطوة خطوة","① الهدف 1 تحقق → الوقف على الدخول (ما في خسارة بعد). ② الهدف 2 → الوقف يبقى على الدخول (نعطي السعر مجال يتنفس). ③ الهدف 3 → الوقف على الهدف 1. ④ الهدف 4 → الوقف على الهدف 2. ⑤ الهدف 5 → نسكّر الكل. يعني الوقف يظل ورا السعر بهدفين، يحمي الربح وما يسكّر الصفقة بدري."],["🎯 ليش جذي؟","بهالطريقة: إذا السعر رجع بعد الهدف 1 تطلع بربح الجزء الأول وبدون خسارة على الباقي. وإذا كمل بقوة، تمسك الحركة كلها بدل ما تطلع بدري."],["⚠️ انتبه","التزم بتحديثات الوقف اللي توصلك. لا ترجّع الوقف لورا «علشان تعطي الصفقة فرصة» — هذا أكثر شي يحوّل صفقة رابحة لخسارة."]],q:["تحقق الهدف 3. وين يكون الوقف تقريباً؟",["على الهدف 1","على الوقف الأصلي","بدون وقف"],0]},{id:"o-calc",ic:"🧮",t:"شلون نحسب النتائج",sub:"صفقتين للداي تريد · 3 صفقات للسكالبينج · بالأمثلة",lvl:1,svg:()=>LG.wrap(LG.tx(350,24,"🎯 داي تريد = صفقتين 0.01",LG.gold,12,"end")+LBox(150,34,200,26,"rgba(61,214,140,.16)","#3DD68C")+LG.tx(340,52,"① تتسكّر عند الهدف 1 ← ربح 10",LG.up,11,"end")+LBox(150,66,200,26,"rgba(61,214,140,.16)","#3DD68C")+LG.tx(340,84,"② تكمل والوقف يلحق ← ربح 20",LG.up,11,"end")+LG.tx(140,64,"المجموع",LG.txt,10,"end")+LG.tx(140,84,"30 دولار",LG.gold,15,"end")+LG.tx(350,118,"⚡ سكالبينج = 3 صفقات 0.01","#B48CFF",12,"end")+[["① الهدف 1 ← ربح 5",128],["② الهدف 2 ← ربح 10",152],["③ تكمل ← ربح 15",176]].map(([t,e])=>LBox(150,e,200,20,"rgba(180,140,255,.14)","#B48CFF")+LG.tx(340,e+14,t,"#E2D6FF",10,"end")).join("")+LG.tx(140,150,"المجموع",LG.txt,10,"end")+LG.tx(140,170,"30 دولار",LG.gold,15,"end")),sec:[["🤔 ليش مو رقم واحد؟","لأن الصفقة الحقيقية تنقسم. نحسب النتيجة بنفس الطريقة اللي المتداول المحترف يسويها، مو «أبعد هدف وصل له السعر» — جذي الأرقام صادقة وتقدر تطلعها انت بنفسك."],["🎯 الداي تريد (صفقتين)","كل وحدة 0.01 لوت. الأولى تتسكّر عند الهدف 1. الثانية تكمل والوقف يلحق الأهداف لين تتسكّر. النتيجة = مجموع الصفقتين. مثال: الهدف 1 = 10$ والثانية سكرت على الوقف المتحرك عند 20$ → المجموع +30$."],["⚡ السكالبينج (3 صفقات)","لأن أهدافه قريبة: الأولى عند الهدف 1، الثانية عند الهدف 2، والثالثة تكمل والوقف يلحقها. وإذا ضربت الوقف قبل أي هدف، الخسارة على الثلاث."],["💵 الحساب","على الذهب: كل 1$ حركة = 1$ ربح أو خسارة لكل 0.01 لوت. لو تداولت 0.10 لوت، اضرب الأرقام × 10."],["⚠️ انتبه","الخسائر مسجلة بالموقع مثل الأرباح — ما ينحذف شي. شوف النتائج على فترة (شهر أو 3 شهور)، مو على صفقة وحدة."]],go:["#home","📊 شوف نتائج كل قسم بالرئيسية"],q:["داي تريد: الصفقة الأولى +10$ والثانية سكرت على الدخول ($0). كم النتيجة؟",["+10$","+20$","صفر"],0]},{id:"s-struct",ic:"🏗️",t:"هيكل السوق: BOS و CHoCH",sub:"القمم والقيعان — متى الاتجاه يكمل ومتى ينقلب",lvl:2,full:1,svg:t=>LG.wrap(LG.pl("10,170 50,120 80,140 130,80 160,105 210,45 240,75"+(t?" 270,60 300,118 350,150":" 270,60"))+LG.ln(110,120,220,120,LG.up,"4 3")+LG.tx(214,116,"BOS ⬆️",LG.up,10,"end")+LG.ln(160,80,260,80,LG.up,"4 3")+LG.tx(258,76,"BOS ⬆️",LG.up,10,"end")+LG.tx(50,112,"HH",LG.up,10)+LG.tx(80,154,"HL",LG.up,10)+LG.tx(130,72,"HH",LG.up,10)+LG.tx(160,120,"HL",LG.up,10)+LG.tx(210,38,"HH",LG.up,10)+LG.tx(240,90,"HL",LG.up,10)+(t?LG.ln(200,75,350,75,LG.dn,"4 3")+LG.ring(290,100)+LG.pill(300,172,"CHoCH ⬇️ كسر آخر قاع صاعد",LG.dn):"")),sec:[["🤔 شنو هيكل السوق؟","الاتجاه الصاعد = قمم أعلى (HH) وقيعان أعلى (HL). الهابط = قمم أدنى وقيعان أدنى. هذا أبسط وأصدق شي يقول لك وين السوق رايح."],["⬆️ BOS — كسر الهيكل","Break of Structure: السعر يكسر آخر قمة بالاتجاه الصاعد (أو آخر قاع بالهابط). يعني الاتجاه مستمر."],["🔄 CHoCH — تغيّر الطابع","Change of Character: بالاتجاه الصاعد، السعر يكسر آخر قاع أعلى (HL) لتحت. هذي أول علامة إن الاتجاه ممكن ينقلب. اضغط ▶️ وشوفها."],["🤖 شلون نستخدمه؟","نحدد الاتجاه على كل فريم من الهيكل (مو من لون الشمعة). لهالسبب أحياناً تشوف شموع خضرا والفريم مكتوب «ضدنا» — لأن الهيكل للحين ما انكسر."],["⚠️ انتبه","شمعة وحدة كبيرة مو كسر هيكل. الكسر الصح = إغلاق شمعة وراء المستوى، مو بس ذيل."]],q:["بالاتجاه الصاعد، السعر سكّر تحت آخر قاع أعلى (HL). شنو يسمى؟",["CHoCH — تغيّر الطابع","BOS — الاتجاه مستمر","ما له معنى"],0]},{id:"s-zones",ic:"🧊",t:"المناطق: أوردر بلوك والفجوات FVG",sub:"وين الكبار دخلوا — ووين السعر يرجع",lvl:2,svg:()=>LG.wrap('<rect x="40" y="118" width="310" height="30" fill="rgba(61,214,140,.16)"/>'+LG.tx(345,164,"🟩 أوردر بلوك (منطقة طلب)",LG.up,10,"end")+LCk(60,126,142,118,150)+LCk(80,140,98,92,146,14)+LCk(100,98,70,64,100)+LCk(120,72,52,46,80)+'<rect x="88" y="80" width="262" height="12" fill="rgba(78,168,255,.22)"/>'+LG.tx(345,76,"🟦 فجوة FVG",LG.blue,10,"end")+LG.pl("128,52 170,40 210,70 250,96 280,126 300,108 330,60",LG.gold,2.4)+LG.ring(280,126)+LG.pill(110,182,"يرجع للمنطقة ويرتد ⬆️",LG.up)),sec:[["🧊 أوردر بلوك","آخر شمعة عكسية قبل حركة قوية. مثلاً: آخر شمعة حمرا قبل صعود قوي — هذا المكان اللي غالباً دخل فيه الكبار، وكثير مرات السعر يرجع له ويرتد منه."],["🟦 الفجوة FVG","Fair Value Gap: لمن السعر يتحرك بسرعة تنترك «فجوة» بين ذيل الشمعة الأولى وذيل الشمعة الثالثة. السوق يحب يرجع يعبيها قبل ما يكمل."],["🎯 ليش مهمة؟","هذي المناطق تعطي دخول بسعر أحسن ووقف أقرب. بدل ما تلاحق السعر فوق، تنتظره يرجع للمنطقة."],["🤖 شلون نستخدمها؟","مناطق الدخول بالتوصيات غالباً تكون أوردر بلوك أو فجوة على الفريمات الكبيرة، ولازم يكون معها سبب ثاني (اتجاه، سيولة، شكل)."],["⚠️ انتبه","مو كل منطقة تشتغل. المنطقة اللي انلمست مرات وايد تضعف، والمنطقة ضد الاتجاه الكبير خطيرة. ولا تدخل بدون تأكيد."]],q:["شنو الأوردر بلوك؟",["آخر شمعة عكسية قبل حركة قوية","أي شمعة خضرا","خط ترند"],0]},{id:"s-sweep",ic:"🎣",t:"صيد السيولة + تغيّر الهيكل",sub:"أقوى نموذج دخول عند المال الذكي",lvl:3,full:1,svg:t=>LG.wrap(LG.ln(10,140,250,140,LG.blue,"5 4")+LG.tx(14,156,"💧 قيعان متساوية",LG.blue,10,"start")+LG.pl("10,90 50,138 80,104 120,139 150,100 170,118 195,170 210,128"+(t?" 240,96 260,108 300,60 350,36":""))+LG.ring(195,170)+LG.pill(195,186,"① صاد الوقوفات",LG.blue)+LG.ln(140,100,260,100,LG.gold,"4 3")+(t?LG.ring(240,96)+LG.pill(250,80,"② كسر الهيكل CHoCH",LG.gold)+LG.pill(300,24,"③ الحركة الحقيقية ⬆️",LG.up):"")),sec:[["🤔 شنو يصير؟","① السعر ينزل تحت قيعان واضحة ويصيد الوقوفات اللي تحتها (ذيل طويل). ② بعدها يرجع بقوة ويكسر آخر قمة صغيرة (CHoCH). ③ وتبدي الحركة الحقيقية بالاتجاه المعاكس. اضغط ▶️."],["🎯 ليش قوي؟","الصيد يعطي الكبار السيولة اللي يحتاجونها، وكسر الهيكل بعده يأكد إنهم دخلوا فعلاً. الاثنين مع بعض أقوى بوايد من كل واحد بروحه."],["🤖 شلون نستخدمه؟","لمن يصير صيد سيولة وبعده تغيّر هيكل، ينحسب من «التأكيدات الإضافية» ويرفع قوة التوصية. أحياناً تشوفه بالكرت: «💧 صيد سيولة + تغيّر الهيكل»."],["⚠️ انتبه","الصيد بروحه بدون كسر هيكل ممكن يكون بداية نزول أقوى. لا تشتري على الذيل مباشرة — انتظر الكسر والتأكيد."]],q:["شنو الترتيب الصح للنموذج؟",["صيد سيولة ← كسر هيكل ← الحركة","كسر هيكل ← صيد ← لا شي","بس ذيل طويل يكفي"],0]},{id:"d-turn",ic:"🧭",t:"معنا · ضدنا · بلش يعدل",sub:"شلون نعرف الفريم بدا ينقلب لجهتنا",lvl:2,svg:()=>LG.wrap(LBox(244,12,108,176,"rgba(61,214,140,.10)","#3DD68C")+LBox(126,12,108,176,"rgba(255,107,107,.10)","#FF6B6B")+LBox(8,12,108,176,"rgba(242,183,5,.10)","#F2B705")+LG.tx(298,34,"✅ معنا",LG.up,12)+LG.tx(180,34,"⛔ ضدنا",LG.dn,12)+LG.tx(62,34,"🔄 بلش يعدل",LG.gold,12)+LG.pl("254,150 281,120 296,130 321,90 336,98 344,60",LG.up,2.4)+LG.pl("136,60 160,92 175,82 200,122 212,112 226,150",LG.dn,2.4)+[0,1,2,3,4,5].map(t=>{const e=[36,30,22,14,8,3][t];return'<rect x="'+(18+t*15)+'" y="110" width="10" height="'+e+'" rx="2" fill="'+(t<2?"#FF6B6B":"#F2B705")+'"/>'}).join("")+LG.ln(14,110,110,110,LG.txt,"2 2",1)+LG.tx(62,172,"الماكد يصغر",LG.txt,10)+LG.tx(62,96,"النزول يضعف",LG.txt,10)),sec:[["✅ معنا","هيكل الفريم بنفس اتجاه التوصية (قمم وقيعان صاعدة للشراء). هذا أحسن وضع."],["⛔ ضدنا","الهيكل عكس التوصية. الدخول هني خطر، لأنك تمشي عكس التيار."],["🔄 بلش يعدل","الهيكل للحين ضدنا، بس فيه علامات إن الحركة المعاكسة تضعف: الماكد يتحسن شمعة ورا شمعة، أو ADX (قوة الاتجاه) ينزل، أو RSI طالع من منطقة التشبع. يعني التيار ضدنا بس قاعد يهدى ويلف."],["🎯 ليش مهم؟","لو ننتظر الفريم الكبير ينقلب بالكامل، أغلب الأحيان يكون السعر طار وراحت الدخلة. «بلش يعدل» يعطينا دخول أبكر بأمان معقول."],["🤖 شلون نستخدمه؟","بكرت «التوصية تتجهز» تشوف مثلاً: «✅ الساعة ضدنا بس بلش يعدل · الماكد يتحسن». هذا ينحسب مقبول. أما «⏳ ضدنا — ننتظره يتعدل» فيعني باقي ما بدا."]],q:["الساعة هابطة بس الماكد يتحسن 3 شمعات ورا بعض. شنو الوصف الصح؟",["ضدنا بس بلش يعدل","معنا تماماً","ما يفرق"],0]},{id:"d-mom",ic:"📶",t:"مؤشر الاتجاه وقوة الحركة",sub:"نسبة الصعود والنزول على كل فريم",lvl:1,svg:()=>LG.wrap([["الربع ساعة",72],["الساعة",55],["الأربع ساعات",36],["اليومي",68]].map(([t,e],s)=>{const n=24+s*42,l=220;return LG.tx(350,n+14,t,LG.txt,11,"end")+'<rect x="16" y="'+n+'" width="'+l+'" height="18" rx="9" fill="rgba(255,107,107,.55)"/><rect x="'+(16+l*(1-e/100))+'" y="'+n+'" width="'+l*e/100+'" height="18" rx="9" fill="#3DD68C"/>'+LG.tx(230,n+13,"⬆️ "+e+"%","#06240f",10,"end")+LG.tx(22,n+13,100-e+"%","#2a0a0a",10,"start")}).join("")),sec:[["🤔 شنو هو؟","قراءة وحدة تجمع كم مؤشر (اتجاه + زخم + قوة) على كل فريم، وتطلعها كنسبة: صعود كم % ونزول كم %. تلقاه بصفحة التوصيات تحت «الاتجاه وقوة الحركة»."],["📖 شلون أقراه؟","فوق 60% صعود = الكفة للمشترين. فوق 60% نزول = الكفة للبياعين. قريب من 50% = السوق متردد. والأهم إن الفريمات تتفق مع بعض."],["🎯 ليش مهم؟","الهيكل يقول لك وين الاتجاه، ومؤشر الاتجاه يقول لك «الحين» شكثر قوته. ممكن الهيكل صاعد بس الزخم نازل مؤقتاً (تصحيح)."],["🤖 شلون نستخدمه؟","من شروط «ادخل الآن» إن مؤشر الاتجاه يأكد. لو تشوف بالكرت «⏳ مؤشر الاتجاه ما يأكد للحين: الأربع ساعات نزول 64%» يعني الهيكل معنا بس الحركة الحين ضدنا — فننتظر."],["⚠️ انتبه","النسبة تتغير مع كل شمعة. لا تبني قرار على قراءة وحدة — شوف الفريم الكبير أول."]],go:["#chart","📈 شوف مؤشر الاتجاه الحين"],q:["الأربع ساعات: نزول 70%، وعندك توصية شراء. شنو يعني؟",["الزخم ضدنا الحين — ننتظر يتعدل","ادخل بلوت أكبر","المؤشر خربان"],0]},{id:"d-rev",ic:"🔄",t:"مع الاتجاه أو انعكاس؟",sub:"ليش توصيات الانعكاس تحتاج تأكيد أكثر",lvl:2,svg:()=>LG.wrap(LBox(186,12,166,176,"rgba(61,214,140,.08)","#3DD68C")+LBox(8,12,166,176,"rgba(242,183,5,.08)","#F2B705")+LG.tx(269,34,"🔥 مع الاتجاه",LG.up,12)+LG.tx(91,34,"🔄 انعكاس",LG.gold,12)+LG.pl("196,170 228,130 248,145 278,100 298,118 328,70 342,60",LG.up,2.4)+LG.ring(298,118)+LG.tx(269,182,"ندخل على التصحيح",LG.txt,10)+LG.pl("18,50 52,90 72,80 102,130 122,160 140,150 162,110",LG.gold,2.4)+LG.ring(122,160)+LG.tx(91,182,"قاع + شمعة تأكيد",LG.txt,10)+'<rect x="108" y="140" width="28" height="30" rx="6" fill="none" stroke="#3DD68C" stroke-width="2"/>'),sec:[["🔥 مع الاتجاه","السوق صاعد، ننتظره يصحح (ينزل شوي) لمنطقة قوية وندخل شراء معه. هذي أعلى نسبة نجاح لأنك تمشي مع التيار."],["🔄 انعكاس","السوق نازل، ونتوقع إنه بيلف من منطقة قوية جداً (قاع يومي، هارمونيك، دايفرجنس). الربح ممكن يكون كبير لأنك تمسك أول الحركة، بس المخاطرة أعلى."],["🕯️ ليش الانعكاس يحتاج شمعة؟","لأنك تشتري والسعر للحين نازل. ما ندخل لين تطلع شمعة تأكيد داخل المنطقة (رفض، ابتلاعية، مطرقة) ويبدا الزخم يتعدل. بالكرت تشوفها «🔄 انعكاس» وبالبوت «HIDDEN REV» أو «REV»."],["⚠️ انتبه","إذا التوصية انعكاس وما توصلك «ادخل الآن» والسعر كمل بالاتجاه القديم — هذا معناه الشروط حمتك. لا تدخل «توقع» بدون تأكيد."]],q:["أي نوع يحتاج تأكيد أكثر قبل الدخول؟",["🔄 الانعكاس","🔥 مع الاتجاه","نفس الشي"],0]},{id:"t-sess",ic:"🕐",t:"جلسات السوق وأحسن وقت",sub:"آسيا · لندن · نيويورك — بتوقيت الكويت",lvl:1,svg:()=>{const t=e=>14+e/24*332;return LG.wrap(LG.ln(14,160,346,160,LG.txt,"",1)+[0,4,8,12,16,20,24].map(e=>LG.tx(t(e),176,String(e),LG.txt,10)).join("")+LBox(t(3),32,t(12)-t(3),26,"rgba(78,168,255,.25)","#4EA8FF")+LG.tx((t(3)+t(12))/2,50,"🌏 آسيا","#9FCBFF",11)+LBox(t(11),70,t(20)-t(11),26,"rgba(242,183,5,.25)","#F2B705")+LG.tx((t(11)+t(20))/2,88,"🇬🇧 لندن",LG.gold,11)+LBox(t(16),108,t(24)-t(16),26,"rgba(61,214,140,.25)","#3DD68C")+LG.tx((t(16)+t(24))/2,126,"🇺🇸 نيويورك",LG.up,11)+'<rect x="'+t(16)+'" y="26" width="'+(t(20)-t(16))+'" height="140" fill="rgba(255,213,74,.10)"/>'+LG.pill((t(16)+t(20))/2,192,"🔥 أقوى وقت",LG.g2))},sec:[["🕐 الجلسات (شتوي، بتوقيت الكويت تقريباً)","🌏 آسيا: من الفجر لين الظهر — حركة هادية غالباً. 🇬🇧 لندن: من 11 الصبح لين 8 بالليل — تبدا السيولة الحقيقية. 🇺🇸 نيويورك: من 4 العصر لين 1 الفجر — أقوى حركة على الذهب. بالصيفي كل شي يتقدم ساعة."],["🔥 أحسن وقت","تداخل لندن ونيويورك (تقريباً 4 العصر لين 8 بالليل بالشتوي). هني السيولة أعلى، والحركة أوضح، والأخبار الأمريكية تنزل."],["⏰ الفتح والإغلاق","الذهب يفتح ليلة الاثنين (2 الفجر شتوي / 1 صيفي) ويغلق فجر السبت (1 الفجر شتوي / 12 الليل صيفي)، وفيه استراحة يومية ساعة. بالرئيسية فيه عداد يقول لك كم باقي."],["🤖 شلون نستخدمها؟","التوصيات تنزل أكثر بأوقات السيولة. وبرا هالأوقات الشروط تكون أصعب، لأن الحركة الضعيفة تعطي إشارات كاذبة."],["⚠️ انتبه","أول دقايق بعد الفتح وقبل الإغلاق السبريد يكبر والحركة غريبة — تجنب الدخول فيها."]],go:["#news","🕐 شوف الجلسات الحين"],q:["متى أقوى حركة على الذهب عادةً؟",["تداخل لندن ونيويورك","منتصف جلسة آسيا","وقت الإغلاق"],0]},{id:"t-news",ic:"📰",t:"الأخبار القوية وقراءة الأجندة",sub:"ليش ما ندخل قبل الخبر — وشلون تقرأ الأرقام",lvl:1,svg:()=>LG.wrap(LBox(10,14,340,70,"rgba(255,255,255,.04)","rgba(255,107,107,.6)")+LG.tx(340,36,"🇺🇸 الوظائف غير الزراعية (NFP)","#fff",12,"end")+LG.pill(52,34,"🔴 قوي",LG.dn)+LG.tx(300,66,"الفعلي",LG.txt,10)+LG.tx(200,66,"المتوقع",LG.txt,10)+LG.tx(100,66,"السابق",LG.txt,10)+LG.tx(300,80,"250K",LG.dn,12)+LG.tx(200,80,"180K","#fff",12)+LG.tx(100,80,"170K","#fff",12)+LG.pl("20,150 70,148 110,152 140,150 150,110 160,178 175,120 190,170 220,140 260,150 300,146 340,150")+LG.ring(160,178)+LG.pill(160,100,"⚡ لحظة الخبر",LG.g2)+LG.tx(340,190,"حركة عنيفة بالاتجاهين",LG.txt,10,"end")),sec:[["📰 أهم الأخبار للذهب","الأخبار الأمريكية أقواها: الوظائف (NFP) · التضخم (CPI) · قرار الفائدة واجتماع الفيدرالي (FOMC) · كلام رئيس الفيدرالي. هذي تحرك الذهب عشرات الدولارات بدقايق."],["🎨 الألوان بالأجندة","🔴 قوي · 🟠 متوسط · 🟡 ضعيف. ولمّا ينزل الرقم: 🟢 أخضر = زين للذهب (يطلع غالباً)، 🔴 أحمر = سلبي للذهب (ينزل غالباً). القاعدة: رقم أمريكي أقوى من المتوقع → الدولار يقوى → الذهب ينزل."],["⛔ ليش ما ندخل قبل الخبر؟","لحظة الخبر السعر يتحرك بعنف بالاتجاهين ويضرب الوقوفات قبل ما يقرر. لهالسبب ما تطلع «ادخل الآن» إذا فيه خبر قوي قريب، ونفضل ننتظر لين يهدى."],["📱 الأجندة بالموقع","تبويب 📰 الأخبار ← 📅 الأجندة: فلتر «القوية بس 🔥» يطلع لك اللي يهمك، وكل يوم عنوانه ثابت فوق وانت تنزل. وبالرئيسية يطلع لك الخبر القوي الجاي بالعد التنازلي."],["⚠️ انتبه","إذا عندك صفقة مفتوحة والخبر قريب: لا توسّع الوقف، وفكر تثبت جزء من الربح قبله."]],go:["#market/cal","📅 افتح الأجندة"],q:["رقم الوظائف الأمريكي طلع أقوى بوايد من المتوقع. شنو الأقرب يصير للذهب؟",["ينزل (الدولار يقوى)","يطلع أكيد","ما يتأثر"],0]});const BASIC_KEEP=()=>{const t={"شلون تقرا التوصية؟":"o-card","جني الأرباح ونقل الوقف":"o-manage","الأخبار والذهب":"t-news"};return LESSONS.filter(([e])=>{const s=t[e];if(!s)return!0;const n=lCatOf(s);return!(n&&lVis(n))})},GUIDE_STEPS=[["📲","ثبّت الموقع على شاشتك","بالآيفون: زر المشاركة ← «إضافة إلى الشاشة الرئيسية». بالأندرويد: القائمة ⋮ ← «تثبيت التطبيق». جذي يفتح مثل التطبيق وتوصلك الإشعارات."],["🔔","فعّل الإشعارات","من صفحة «اشتراكي» ← «🔔 التنبيهات» اختار شنو يوصلك، علشان توصلك «ادخل الآن» والأهداف والوقف على طول."],["💬","تأكد من رقم الواتساب","التوصيات توصلك صورة على الواتساب الخاص. تأكد إن رقمك صح بحسابك."],["🗂️","اعرف الأقسام","⚡ سكالبينج سريع · 🎯 داي تريد يومي · 💼 استثمار طويل · 🤖 اكسبيرت. اختار اللي يناسب وقتك (شوف درس «الأقسام الأربعة»)."],["🧮","حدد حجم اللوت","قبل أول صفقة استخدم «حاسبة اللوت» وخل المخاطرة صغيرة من رصيدك بكل صفقة."],["⏳","لا تدخل قبل «ادخل الآن»","«التوصية تتجهز» مو دخول. انتظر الإشعار، وادخل وانت داخل المنطقة — لا تلاحق السعر."],["🛡️","التزم بالوقف وتحديثاته","أول ما يتحقق الهدف 1 الوقف ينقل للدخول. طبّق التحديثات أول بأول ولا ترجّع الوقف لورا."],["📊","شوف النتائج على فترة","بالرئيسية نتائج كل قسم (يوم · أسبوع · شهر · 3 شهور · الكل). الحكم على شهر، مو على صفقة."],["🗳️","شارك وكسب","صوّت كل يوم (صعود ولا نزول) واجمع نقاط بلوحة المتصدرين، وادعُ ربعك بكودك وخذ أسبوع ببلاش."],["🙋","عندك سؤال؟","اضغط 💬 فوق وكلم الإدارة مباشرة."]];function GuidePage(){const t=h("div",{class:"screen",style:"gap:10px"});return GUIDE_STEPS.forEach(([e,s,n],l)=>t.append(h("div",{class:"card lguide"},h("span",{class:"lgn num"},l+1),h("div",null,h("b",null,e+" "+s),h("p",{class:"muted"},n))))),t.append(h("a",{class:"btn primary",href:"#learn/c-ours",style:"text-align:center"},"🎯 ابدأ بدروس «شلون تشتغل توصياتنا» ←")),t}let LPUB=null;async function loadLPub(){if(LPUB)return LPUB;try{const{data:t}=await sb.from("app_config").select("value").eq("key","learn_pub").maybeSingle();LPUB=t&&t.value||{}}catch{LPUB={}}return LPUB}const lKey=t=>t.draft||"c-"+t.id,lPub=t=>!t||(t.draft?!!(LPUB&&LPUB[t.draft]):!(LPUB&&LPUB[lKey(t)]===!1)),lVis=t=>lPub(t)||!!S.admin;async function lSetPub(t,e){const s=Object.assign({},LPUB||{},{[t]:!!e}),{error:n}=await sb.from("app_config").upsert({key:"learn_pub",value:s,updated_at:new Date().toISOString()});if(n){toast(errText(n),!0);return}LPUB=s,toast(e?"✅ انعرض للمشتركين":"🙈 رجع مسودة (لك بس)"),route()}TOOL_LESSONS.push({id:"r-risk",ic:"🛟",t:"كم تخاطر بكل صفقة؟",sub:"قاعدة 1–2% اللي تحمي حسابك من الانهيار",lvl:1,svg:()=>LG.wrap(LG.ln(20,20,20,170,LG.txt,"",1)+LG.ln(20,170,350,170,LG.txt,"",1)+LG.pl("20,30 53,34 86,38 119,42 152,46 185,50 218,54 251,58 284,62 317,66 350,70",LG.up,2.6)+LG.pl("20,30 53,44 86,57 119,69 152,80 185,90 218,99 251,107 284,114 317,121 350,126",LG.gold,2.6)+LG.pl("20,30 53,58 86,82 119,103 152,121 185,136 218,148 251,158 284,165 317,170",LG.dn,2.6)+LG.tx(346,62,"82%",LG.up,12,"end")+LG.tx(346,118,"60%",LG.gold,12,"end")+LG.tx(312,162,"35%",LG.dn,12,"end")+LG.tx(120,120,"🟢 تخاطر 2 بالمية",LG.up,10,"end")+LG.tx(120,138,"🟡 تخاطر 5 بالمية",LG.gold,10,"end")+LG.tx(120,156,"🔴 تخاطر 10 بالمية",LG.dn,10,"end")+LG.tx(185,192,"رصيدك بعد 10 خسارات ورا بعض",LG.txt,10)),sec:[["🤔 شنو القاعدة؟","لا تخاطر بأكثر من 1–2% من رصيدك بالصفقة الوحدة. يعني لو رصيدك 1000$، أقصى خسارة مقبولة بالصفقة 10–20$. الوقف يحدد الخسارة، واللوت تختاره علشان الخسارة ما تعدّي هالرقم."],["📉 ليش؟","أي نظام مهما كان قوي يمر بسلسلة خسارات. بـ 2% لو خسرت 10 مرات ورا بعض يظل عندك تقريباً 82% من رصيدك. بـ 10% يظل 35% بس — وترجيعها يحتاج تضاعف حسابك تقريباً 3 مرات."],["🧮 شلون أحسبها؟","المخاطرة بالدولار ÷ مسافة الوقف بالدولار = عدد وحدات 0.01. مثال: تبي تخاطر 20$ والوقف بعيد 10$ → 2 × 0.01 = 0.02 لوت. أو استخدم «🧮 حاسبة اللوت» وتعطيك الرقم على طول."],["⚠️ انتبه","لا تكبّر اللوت بعد خسارة علشان «تعوّض». هذا أسرع طريق لتصفير الحساب."]],go:["#learn/calc","🧮 افتح حاسبة اللوت"],q:["رصيدك 2000$ وتبي تخاطر 1%. كم أقصى خسارة بالصفقة؟",["20$","200$","2$"],0]},{id:"r-rr",ic:"⚖️",t:"العائد مقابل المخاطرة",sub:"ليش ممكن تربح حتى لو نص صفقاتك خسرانة",lvl:1,svg:()=>LG.wrap(LBox(200,30,150,50,"rgba(255,107,107,.18)","#FF6B6B")+LG.tx(275,52,"🛑 المخاطرة",LG.dn,11)+LG.tx(275,70,"10 دولار","#fff",13)+LBox(200,92,150,90,"rgba(61,214,140,.18)","#3DD68C")+LG.tx(275,128,"🎯 العائد",LG.up,11)+LG.tx(275,150,"20 دولار","#fff",14)+LG.tx(100,60,"1 : 2",LG.gold,30)+LG.tx(100,96,"من 10 صفقات",LG.txt,11)+LG.tx(100,118,"ربح: 4 صفقات × 20",LG.up,11)+LG.tx(100,138,"خسارة: 6 صفقات × 10",LG.dn,11)+LG.pill(100,168,"النتيجة: ربح 20 ✅",LG.up)),sec:[["🤔 شنو يعني 1:2؟","تخاطر بـ 1 علشان تربح 2. لو الوقف بعيد 10$ والهدف بعيد 20$، العائد للمخاطرة 1:2."],["🎯 ليش مهم؟","بـ 1:2 تحتاج تربح بس 34% من صفقاتك علشان تتعادل. يعني حتى لو 6 من 10 صفقات خسرت، ممكن تطلع رابح. المحترف ما يدوّر على «ما أخسر أبد»، يدوّر على «ربحي أكبر من خسارتي»."],["🤖 شلون نستخدمه؟","التوصيات تنحسب بحيث الأهداف تستاهل المخاطرة، وإذا السعر طلع بعيد عن المنطقة والعائد صار ضعيف ما تنرسل «ادخل الآن». ونظام الصفقتين (جزء يتسكّر بدري وجزء يكمل) يرفع العائد الفعلي."],["⚠️ انتبه","لا تقرّب الهدف وتبعّد الوقف «علشان تضمن». هذا يقلب المعادلة ضدك حتى لو نسبة نجاحك عالية."]],q:["العائد للمخاطرة 1:3 — تخاطر 10$. كم الربح إذا وصل الهدف؟",["30$","10$","3$"],0]},{id:"r-psy",ic:"🧠",t:"نفسية المتداول",sub:"الطمع · الخوف · الانتقام — وشلون تسيطر عليهم",lvl:2,svg:()=>LG.wrap(LG.pl("10,150 50,120 90,80 130,40 165,30 200,60 235,110 270,160 300,170 330,140 350,120",LG.gold,2.8)+LG.pill(70,96,"😊 أمل",LG.up)+LG.pill(150,20,"🤑 طمع",LG.g2)+LG.pill(222,82,"😰 خوف","#FF9F43")+LG.pill(285,186,"😱 ذعر",LG.dn)+LG.pill(330,112,"😤 انتقام","#B48CFF")),sec:[["🤑 الطمع","تشوف ربح وتبي أكثر، فتشيل الهدف أو تفتح صفقة زيادة بدون سبب. النتيجة غالباً: الربح يرجع خسارة."],["😰 الخوف","تسكّر الصفقة الرابحة بدري من أول حركة ضدك، أو ما تدخل التوصية بعد خسارة. فتخسر الصفقات الزينة وتبقى لك الخسارات."],["😤 الانتقام","بعد خسارة تدخل صفقة على طول بلوت أكبر «علشان أرجعها». هذا أخطر شعور بالتداول، وهو سبب أغلب الحسابات اللي تتصفر."],["🛠️ شلون تسيطر؟","① خطة واضحة قبل الدخول (دخول · وقف · أهداف · لوت). ② مخاطرة ثابتة بكل صفقة. ③ بعد خسارتين ورا بعض وقّف اليوم. ④ لا تراقب كل شمعة — حط الوقف والأهداف وخل الإشعارات تبلغك."],["⚠️ انتبه","السوق ما يعرفك ولا يبي ينتقم منك. كل صفقة مستقلة عن اللي قبلها."]],q:["خسرت صفقة وتبي «ترجعها» بلوت أكبر على طول. شنو هذا؟",["تداول انتقامي — وقّف","خطة ذكية","إدارة مخاطر"],0]},{id:"r-plan",ic:"📓",t:"خطة التداول ودفتر الصفقات",sub:"اللي يفرق المحترف عن المقامر",lvl:2,svg:()=>LG.wrap(LBox(70,10,220,180,"#F5EFD9","#C67F0B")+LG.ln(90,10,90,190,"#E08A8A","",1.4)+[["📅 التاريخ والقسم",40],["📍 الدخول · 🛑 الوقف · 🎯 الهدف",66],["💰 اللوت والمخاطرة %",92],["🧠 ليش دخلت؟",118],["📊 النتيجة",144],["✍️ شنو تعلمت؟",170]].map(([t,e])=>LG.tx(278,e,t,"#3a2c05",11,"end")+LG.ln(100,e+8,280,e+8,"rgba(58,44,5,.25)","",1)).join("")),sec:[["🗺️ خطة التداول","ورقة بسيطة تكتبها مرة وحدة وتلتزم فيها: أي أقسام بتتابع · كم تخاطر بالصفقة · كم صفقة باليوم كحد أقصى · متى توقف (مثلاً بعد خسارتين) · أوقات ما تتداول فيها (قبل الأخبار القوية)."],["📓 دفتر الصفقات","سجل كل صفقة: الدخول والوقف والهدف واللوت والنتيجة، وليش دخلت وشنو حسيت. بعد شهر بتشوف بوضوح وين أخطاءك المتكررة."],["🎯 ليش مهم؟","اللي ما يقيس ما يتحسن. أغلب المتداولين يحسون إنهم «قريب من الربح»، والدفتر يقول لهم الحقيقة بالأرقام."],["🤖 بالموقع","صفحة «اشتراكي» فيها «📒 سجل أرباحي»: تسجل الصفقات اللي دخلتها من التوصيات والربح ينحسب بروحه. ونتائج كل التوصيات مسجلة بالأرشيف — استخدمهم كبداية لدفترك."],["⚠️ انتبه","الخطة بدون التزام ما تسوى شي. إذا كسرت قاعدة، اكتبها بالدفتر علشان تنتبه لها المرة الجاية."]],q:["شنو أهم فايدة لدفتر الصفقات؟",["تشوف أخطاءك المتكررة بالأرقام","تزيد اللوت","تتوقع السعر"],0]},{id:"f-dxy",ic:"💵",t:"الذهب والدولار والعوائد",sub:"العلاقة العكسية اللي تحرك الذهب كل يوم",lvl:1,svg:()=>LG.wrap(LG.pl("10,150 60,135 110,120 160,90 210,80 260,60 310,50 350,40",LG.blue,2.6)+LG.tx(346,32,"💵 الدولار ⬆️",LG.blue,11,"end")+LG.pl("10,50 60,62 110,80 160,105 210,112 260,135 310,145 350,158",LG.gold,2.6)+LG.tx(346,176,"🥇 الذهب ⬇️",LG.gold,11,"end")+LG.pill(110,186,"غالباً يمشون عكس بعض",LG.g2)),sec:[["💵 الدولار","الذهب مسعّر بالدولار. لمن الدولار يقوى، الذهب يصير أغلى على باقي العالم فينزل الطلب عليه وينزل سعره غالباً. ولمن الدولار يضعف، الذهب يطلع."],["📈 العوائد الحقيقية","الذهب ما يعطيك فائدة. فلمن عوائد السندات الأمريكية (بعد خصم التضخم) ترتفع، الناس تفضّل السندات على الذهب. ولمن تنزل، الذهب يصير أحلى."],["🎯 شلون أستفيد؟","قبل ما تدخل شوف وضع الدولار: لو الدولار طالع بقوة اليوم، شراء الذهب يحتاج سبب أقوى. والأخبار الأمريكية القوية تحرك الاثنين مع بعض."],["⚠️ انتبه","العلاقة «غالباً» مو «دايماً». وقت الأزمات الكبيرة ممكن الدولار والذهب يطلعون مع بعض لأن الناس تهرب للأمان."]],q:["الدولار قوي جداً اليوم. شنو الأقرب يصير للذهب؟",["ينزل غالباً","يطلع أكيد","ما يتأثر"],0]},{id:"f-fed",ic:"🏦",t:"الفيدرالي والفائدة",sub:"أقوى حدث يحرك الذهب بالسنة",lvl:2,svg:()=>LG.wrap(LBox(10,20,165,160,"rgba(255,107,107,.10)","#FF6B6B")+LBox(185,20,165,160,"rgba(61,214,140,.10)","#3DD68C")+LG.tx(267,56,"🏦 الفائدة ⬇️","#fff",13)+LG.tx(267,96,"الدولار يضعف",LG.txt,11)+LG.tx(267,140,"🥇 الذهب ⬆️",LG.up,15)+LG.tx(92,56,"🏦 الفائدة ⬆️","#fff",13)+LG.tx(92,96,"الدولار يقوى",LG.txt,11)+LG.tx(92,140,"🥇 الذهب ⬇️",LG.dn,15)),sec:[["🏦 شنو الفيدرالي؟","البنك المركزي الأمريكي. يحدد سعر الفائدة كم مرة بالسنة (اجتماعات FOMC)، ورئيسه لمن يتكلم السوق كله يسمع."],["📉 الفائدة والذهب","رفع الفائدة = الدولار والسندات أقوى = الذهب يضغط لتحت غالباً. خفض الفائدة = العكس، الذهب يستفيد. والأهم من القرار نفسه: «شنو ناوين يسوون بالاجتماعات الجاية»."],["🎯 ليش السوق يتحرك قبل القرار؟","السوق يسعّر التوقعات بدري. إذا الكل متوقع خفض والقرار طلع خفض، ممكن ما يتحرك وايد. المفاجأة هي اللي تسوي الحركة الكبيرة."],["🤖 بالموقع","اجتماعات الفيدرالي وكلام رئيسه تطلع بالأجندة 🔴، وما تطلع «ادخل الآن» قريب منها."],["⚠️ انتبه","ليلة قرار الفائدة لا تدخل صفقات كبيرة. الحركة ممكن تكون عشرات الدولارات بدقايق بالاتجاهين."]],go:["#market/cal","📅 شوف الأجندة"],q:["الفيدرالي خفّض الفائدة بشكل مفاجئ. شنو الأقرب للذهب؟",["يطلع غالباً","ينزل أكيد","ما يتأثر"],0]},{id:"f-safe",ic:"🛡️",t:"الذهب ملاذ آمن",sub:"الحروب والأزمات والبنوك المركزية",lvl:1,svg:()=>LG.wrap(LG.pl("10,160 60,150 100,155 130,148 150,90 170,110 210,100 250,104 280,60 300,80 350,70",LG.gold,2.6)+LG.ring(150,90)+LG.ring(280,60)+LG.pill(150,70,"⚠️ أزمة",LG.dn)+LG.pill(280,40,"🏦 شراء بنوك مركزية",LG.blue)+LG.tx(20,186,"لمن الخوف يزيد ← الطلب على الذهب يزيد",LG.txt,11,"start")),sec:[["🛡️ شنو يعني ملاذ آمن؟","لمن يصير خوف بالعالم (حروب، أزمات بنوك، مشاكل اقتصادية)، المستثمرين يبيعون الأسهم ويشترون الذهب لأنه يحفظ القيمة. فالذهب يطلع."],["🏦 البنوك المركزية","بنوك مركزية بدول كثيرة تشتري ذهب وتخزنه كاحتياطي. هالشراء الكبير والمستمر من أسباب صعود الذهب على المدى الطويل."],["🎯 شلون أستفيد؟","الأخبار الجيوسياسية تسوي قفزات مفاجئة. إذا عندك بيع والخبر مخيف، فكر تقلل المخاطرة. وعلى المدى الطويل هذا سبب إن قسم الاستثمار يدوّر على الشراء أكثر."],["⚠️ انتبه","قفزة الخوف كثير مرات ترجع بسرعة لمن يهدى الخبر. لا تشتري على القمة من الحماس."]],q:["صار توتر كبير بالعالم والأسواق خايفة. شنو الأقرب للذهب؟",["يطلع غالباً","ينزل غالباً","يوقف التداول"],0]},{id:"m-orders",ic:"🧾",t:"أنواع الأوامر",sub:"Market · Limit · Stop — متى تستخدم كل واحد",lvl:1,svg:()=>LG.wrap(LG.ln(10,100,350,100,LG.gold,"",2)+LG.tx(346,94,"السعر الحين",LG.gold,10,"end")+LG.ln(10,40,350,40,LG.dn,"5 4")+LG.tx(14,34,"🔴 Sell Limit — بيع لمن يطلع لهني",LG.dn,10,"start")+LG.ln(10,66,350,66,LG.up,"5 4")+LG.tx(14,60,"🟢 Buy Stop — شراء إذا كسر لفوق",LG.up,10,"start")+LG.ln(10,134,350,134,LG.dn,"5 4")+LG.tx(14,128,"🔴 Sell Stop — بيع إذا كسر لتحت",LG.dn,10,"start")+LG.ln(10,160,350,160,LG.up,"5 4")+LG.tx(14,154,"🟢 Buy Limit — شراء لمن ينزل لهني",LG.up,10,"start")+LG.pill(260,186,"Market = الحين بسعر السوق",LG.g2)),sec:[["⚡ Market (فوري)","تدخل الحين بالسعر الموجود. نستخدمه لمن توصلك «ادخل الآن» والسعر داخل المنطقة."],["⏳ Limit (معلّق بسعر أحسن)","Buy Limit: شراء تحت السعر الحالي (تنتظره ينزل). Sell Limit: بيع فوق السعر الحالي (تنتظره يطلع). مفيد إذا تبي تدخل من منطقة ومشغول."],["🚀 Stop (معلّق على الكسر)","Buy Stop: شراء فوق السعر إذا كسر لفوق. Sell Stop: بيع تحت السعر إذا كسر لتحت. للي يدخل مع الاختراق."],["🛑 الوقف والهدف","Stop Loss و Take Profit تحطهم مع كل صفقة. الوقف يحميك والهدف يسكّر الربح بروحه حتى لو مو جدام الشاشة."],["⚠️ انتبه","الأمر المعلّق ممكن يتفعّل بلحظة خبر بسعر أبعد شوي (انزلاق). ولا تنسى تلغي الأوامر المعلقة القديمة."]],q:["السعر 4060 وتبي تشتري لمن ينزل لـ 4050. أي أمر تستخدم؟",["Buy Limit","Buy Stop","Sell Limit"],0]},{id:"m-costs",ic:"💸",t:"السبريد والسواب والعمولة",sub:"التكاليف المخفية اللي تاكل من ربحك",lvl:1,svg:()=>LG.wrap(LG.ln(20,70,340,70,LG.blue,"",2)+LG.tx(336,62,"Ask (سعر الشراء) 4060.30",LG.blue,11,"end")+LG.ln(20,110,340,110,LG.dn,"",2)+LG.tx(336,128,"Bid (سعر البيع) 4060.00",LG.dn,11,"end")+'<rect x="60" y="70" width="60" height="40" fill="rgba(242,183,5,.25)"/>'+LG.tx(90,94,"السبريد",LG.gold,11)+LG.pill(90,160,"🌙 السواب: رسوم تبييت الليل","#B48CFF")+LG.pill(270,160,"🧾 العمولة: لكل لوت",LG.g2)),sec:[["↔️ السبريد","الفرق بين سعر الشراء (Ask) وسعر البيع (Bid). أول ما تفتح صفقة تكون بخسارة بسيطة بقدر السبريد. على الذهب يكبر وقت الأخبار والفتح والإغلاق."],["🌙 السواب","رسوم (أو أحياناً فايدة) على الصفقة اللي تظل مفتوحة بعد نهاية اليوم. ليلة الأربعاء غالباً تنحسب ثلاث مرات. مهم لقسم الاستثمار لأن صفقاته تطول."],["🧾 العمولة","بعض الحسابات (خصوصاً اللي سبريدها قليل) تاخذ عمولة ثابتة لكل لوت. قارن: سبريد + عمولة = التكلفة الحقيقية."],["🎯 شلون أوفّر؟","تجنب الدخول وقت السبريد العالي · اختار حساب مناسب لأسلوبك · للصفقات الطويلة شوف السواب قبل."],["⚠️ انتبه","السكالبينج أهدافه قريبة، فالسبريد العالي ياكل جزء كبير من الربح. اختار شركة سبريدها على الذهب منخفض."]],q:["شنو السبريد؟",["الفرق بين سعر الشراء وسعر البيع","رسوم التبييت","حجم اللوت"],0]},{id:"m-margin",ic:"🏦",t:"الرافعة والهامش",sub:"ليش الحساب ممكن يتسكّر بروحه — وشلون تتجنبه",lvl:2,svg:()=>LG.wrap(LBox(10,20,340,34,"rgba(61,214,140,.16)","#3DD68C")+LG.tx(340,42,"الرصيد: 1000 دولار",LG.up,12,"end")+LBox(10,62,260,34,"rgba(78,168,255,.16)","#4EA8FF")+LG.tx(260,84,"السيولة Equity: 780",LG.blue,12,"end")+LBox(10,104,80,34,"rgba(242,183,5,.2)","#F2B705")+LG.tx(86,126,"الهامش: 200",LG.gold,11,"end")+LG.tx(340,164,"مستوى الهامش: 390 بالمية","#fff",12,"end")+LG.tx(150,164,"(780 ÷ 200)",LG.txt,10,"end")+LG.tx(340,188,"⚠️ إذا نزل تحت 100 بالمية ← خطر",LG.dn,11,"end")),sec:[["🏗️ الرافعة","الشركة «تسلفك» قوة شرائية. برافعة 1:100 تقدر تفتح صفقة قيمتها 100 ضعف المبلغ المحجوز. الرافعة تكبّر الربح والخسارة مع بعض."],["🔒 الهامش","المبلغ اللي يتحجز من حسابك علشان الصفقة تظل مفتوحة. Equity = رصيدك + أرباح أو خسائر الصفقات المفتوحة. مستوى الهامش = Equity ÷ الهامش × 100%."],["🚨 نداء الهامش والإيقاف","إذا الخسائر كبرت ونزل مستوى الهامش لحد معين (عند أغلب الشركات قريب من 100% ثم 50%)، الشركة تسكّر صفقاتك غصب علشان ما يصير رصيدك بالسالب."],["🎯 شلون تتجنبه؟","مخاطرة 1–2% بالصفقة + وقف دايماً + لا تفتح صفقات وايد بنفس الوقت. بهالطريقة مستوى الهامش يظل عالي ومريح."],["⚠️ انتبه","الرافعة العالية مو مشكلة بروحها — المشكلة اللوت الكبير. اللي يحدد خطرك هو حجم الصفقة والوقف."]],q:["شنو يصير لو مستوى الهامش نزل وايد؟",["الشركة تسكّر صفقاتك غصب","يزيد رصيدك","ما يصير شي"],0]},{id:"m-mt5",ic:"📲",t:"شلون تفتح صفقة بـ MT5",sub:"من الجوال: دخول · وقف · أهداف — خطوة بخطوة",lvl:1,svg:()=>LG.wrap(LBox(120,6,120,188,"#10132f","rgba(255,255,255,.25)")+LBox(130,18,100,22,"rgba(255,255,255,.06)")+LG.tx(180,33,"XAUUSD","#fff",11)+LBox(130,48,100,20,"rgba(255,255,255,.06)")+LG.tx(180,62,"اللوت 0.01",LG.txt,10)+LBox(130,74,100,20,"rgba(255,107,107,.14)")+LG.tx(180,88,"🛑 Stop Loss",LG.dn,10)+LBox(130,100,100,20,"rgba(61,214,140,.14)")+LG.tx(180,114,"🎯 Take Profit",LG.up,10)+LBox(130,140,46,30,"#FF6B6B")+LG.tx(153,160,"Sell","#fff",11)+LBox(184,140,46,30,"#3DD68C")+LG.tx(207,160,"Buy","#06240f",11)+LG.pill(300,30,"① اختار الذهب",LG.g2)+LG.pill(300,62,"② حدد اللوت",LG.g2)+LG.pill(300,100,"③ الوقف والهدف",LG.g2)+LG.pill(300,155,"④ شراء أو بيع",LG.g2)),sec:[["① افتح الذهب","بتطبيق MT5: Quotes (الأسعار) ← اضغط XAUUSD (أو GOLD حسب الشركة) ← New Order (أمر جديد)."],["② حدد اللوت","اكتب حجم الصفقة (مثلاً 0.01). احسبه قبل من «🧮 حاسبة اللوت» حسب رصيدك والوقف."],["③ الوقف والهدف","حط Stop Loss بسعر الوقف من التوصية، و Take Profit بالهدف 1 (أو افتح صفقتين: وحدة للهدف 1 ووحدة للأهداف البعيدة)."],["④ نفّذ","Buy by Market للشراء أو Sell by Market للبيع. بعدها من Trade تشوف الصفقة وتقدر تعدل الوقف (Modify) لمن يوصلك تحديث."],["🛡️ تعديل الوقف","لمن يتحقق الهدف 1: اضغط على الصفقة ← Modify ← غيّر Stop Loss لسعر الدخول ← Modify. جذي صفقتك بأمان."],["⚠️ انتبه","تأكد إنك على XAUUSD مو عملة ثانية، وإن الاتجاه صح (Buy للشراء · Sell للبيع). غلطة اتجاه وحدة تعكس كل شي."]],q:["توصية شراء — أي زر تضغط بالنهاية؟",["Buy","Sell","Close"],0]},{id:"x-fib",ic:"🌀",t:"فيبوناتشي",sub:"مستويات الارتداد 38 · 50 · 61.8 والمنطقة الذهبية",lvl:2,full:1,svg:t=>LG.wrap('<rect x="10" y="98" width="340" height="26" fill="rgba(242,183,5,.16)"/>'+[[20,"0% (القمة)"],[70,"23.6%"],[98,"38.2%"],[110,"50%"],[124,"61.8%"],[180,"100% (القاع)"]].map(([e,s])=>LG.ln(10,e,350,e,e===110||e===124||e===98?LG.gold:LG.txt,"4 4",1.2)+LG.tx(346,e-3,s,e>=98&&e<=124?LG.gold:LG.txt,10,"end")).join("")+LG.pl("20,180 60,140 90,150 140,20"+(t?" 180,70 210,118 230,112 260,60 300,30 350,10":" 180,70 210,118"))+(t?LG.ring(210,118)+LG.pill(140,150,"المنطقة الذهبية ⬆️",LG.g2):"")),sec:[["🤔 شنو هو؟","أداة ترسمها من قاع لقمة (أو العكس) وتطلع مستويات: 23.6% · 38.2% · 50% · 61.8% · 78.6%. السعر بعد حركة قوية كثير مرات يصحح لوحدة منها ويرتد."],["🟨 المنطقة الذهبية","بين 50% و 61.8% (وأحياناً لين 78.6%). هذي أقوى منطقة ارتداد بالترند، ولمن تتلاقى مع أوردر بلوك أو دعم تصير قوية جداً. اضغط ▶️."],["🎯 الأهداف بفيبوناتشي","امتدادات 127% و 161.8% تُستخدم كأهداف بعد ما السعر يكسر القمة."],["🤖 شلون نستخدمه؟","الأهداف الخمسة بالأشكال والهارمونيك مبنية على نسب فيبوناتشي، والمنطقة الذهبية من أسباب اختيار منطقة الدخول."],["⚠️ انتبه","فيبوناتشي مو سحر — لازم سبب ثاني بنفس المنطقة. وارسمه على حركة واضحة، مو على أي قمة وقاع."]],q:["وين «المنطقة الذهبية» بفيبوناتشي؟",["بين 50% و 61.8%","عند 0%","عند 23.6%"],0]},{id:"x-atr",ic:"📏",t:"ATR ووين تحط الوقف",sub:"الوقف حسب حركة السوق — مو رقم ثابت",lvl:2,svg:()=>LG.wrap(LCk(40,90,70,60,100)+LCk(70,72,100,66,108)+LCk(100,100,82,76,112)+LCk(130,84,110,80,128)+LCk(160,108,128,104,140)+LG.ln(10,140,200,140,LG.up,"4 3")+LG.tx(14,154,"القاع",LG.up,10,"start")+'<rect x="210" y="140" w
