<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOLDEN RATIO</title>
<meta name="theme-color" content="#0B0C28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golden Ratio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B0C28;--bg2:#10123A;--panel:#141748;--line:#262A66;
  --fg:#EEF0FF;--muted:#9EA3D6;--gold:#F2B705;--gold2:#C67F0B;--ink:#1A1300;
  --up:#3DD68C;--down:#FF6B6B;--wa:#25D366;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --latin:"Montserrat","Readex Pro",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
body{padding-top:env(safe-area-inset-top)}
/* 📱 الصفحة ما تتحرك كلها: المحتوى بس يتمرر، والقائمة تحت ثابتة (مشكلة iOS) */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:16px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-family:var(--latin);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.pos{color:var(--up)}.neg{color:var(--down)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}

/* top bar */
.top{position:relative;flex:none;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:8px;direction:ltr;text-decoration:none}
.brand img{width:34px;height:34px}
.brand b{font-family:var(--latin);font-weight:800;letter-spacing:.02em}
.brand span{font-family:var(--latin);font-weight:300}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}

/* tabs */
.tabs{position:relative;flex:none;z-index:10;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500;position:relative}
.tabs a[aria-current="page"]{color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dotbadge{position:absolute;top:4px;inset-inline-end:calc(50% - 18px);min-width:16px;height:16px;border-radius:999px;background:var(--down);color:#fff;font:700 .65rem var(--latin);display:grid;place-items:center;padding:0 4px}

main{padding:18px 0 24px}
.screen{display:flex;flex-direction:column;gap:16px}
.h1{font-size:1.5rem;font-weight:700}
.h2{font-size:1.1rem;font-weight:600}
.eyebrow{font-family:var(--latin);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.gold{border-color:var(--gold2);background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 13%,var(--bg2)),var(--bg2))}
.card.soft{background:var(--bg2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.green{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up);border:1px solid color-mix(in srgb,var(--up) 40%,transparent)}
.btn.red{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down);border:1px solid color-mix(in srgb,var(--down) 40%,transparent)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

label{font-size:.85rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px}
.pill.buy,.pill.on{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.pill.sell,.pill.off{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}
.pill.wait{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.pill.gray{background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted)}

/* signal card */
.sig{background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sig.open{border-color:var(--gold2)}
.online{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.online i{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px color-mix(in srgb,var(--up) 22%,transparent)}
.online b{color:var(--gold);font-family:var(--latin);font-size:1rem}
.tv{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg2);min-height:60px}
.tv .tradingview-widget-copyright{display:none}
.tv iframe{color-scheme:light}
.tv.price{background:linear-gradient(180deg,#141a4a,#0d1238);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.cal-day{position:sticky;top:64px;z-index:3;display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:800;margin:34px 0 4px;padding:14px 16px;border-radius:14px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);box-shadow:0 10px 20px -10px #000,0 0 0 3px var(--bg)}
.cal-day:first-child{margin-top:8px}
.cal-day::before{content:"";position:absolute;inset-inline:0;top:-20px;border-top:2px dashed color-mix(in srgb,var(--gold) 40%,transparent)}
.cal-day:first-child::before{display:none}
.cal-day .cnt{margin-inline-start:auto;font-size:.78rem;font-weight:700;background:rgba(0,0,0,.18);padding:3px 10px;border-radius:999px}
.cal-day.past{background:linear-gradient(180deg,#3A3F72,#2B2F5C);color:var(--fg)}
.cal-day.past .cnt{background:rgba(255,255,255,.1)}
.cal-day.today{background:linear-gradient(180deg,#2BD48A,#15A86A);color:#04140C}
.cal-day .tag{font-size:.75rem;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:999px}
.cal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;border-inline-start:4px solid var(--line)}
.cal.up{border-inline-start-color:var(--up)}.cal.dn{border-inline-start-color:var(--down)}
.cal-h{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.cal-t{color:var(--muted);font-size:.85rem}.cal-f{font-size:1.2rem}
.cal-n b{display:block;font-size:.95rem;line-height:1.35}.cal-n small{color:var(--muted);font-size:.72rem}
.imp{display:inline-flex;align-items:flex-end;gap:2px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.imp i{width:4px;border-radius:2px;background:currentColor;opacity:.25}.imp i:nth-child(1){height:6px}.imp i:nth-child(2){height:9px}.imp i:nth-child(3){height:12px;margin-inline-end:4px}
.imp.hi{color:#FF4D5E;background:color-mix(in srgb,#FF4D5E 16%,transparent)}.imp.hi i{opacity:1}
.imp.mid{color:#FF9F1C;background:color-mix(in srgb,#FF9F1C 15%,transparent)}.imp.mid i:nth-child(-n+2){opacity:1}
.imp.lo{color:#F2D21B;background:color-mix(in srgb,#F2D21B 13%,transparent)}.imp.lo i:nth-child(1){opacity:1}
.cal-v{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.cal-v div{background:var(--bg);border-radius:10px;padding:6px 4px}.cal-v small{display:block;color:var(--muted);font-size:.72rem}
.cal-v b{font-size:1rem}.cal-v b.big{font-size:1.25rem}
.cal-v b.up,.cal-r.up b{color:var(--up)}.cal-v b.dn,.cal-r.dn b{color:var(--down)}
.cal-r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem;padding:6px 10px;border-radius:10px}
.cal-r.up{background:color-mix(in srgb,var(--up) 13%,transparent)}.cal-r.dn{background:color-mix(in srgb,var(--down) 13%,transparent)}.cal-r.eq{background:color-mix(in srgb,var(--muted) 12%,transparent)}
.cal-r span{color:var(--muted)}
.cal-r.soon{background:color-mix(in srgb,#FF4D5E 10%,transparent)}.cal-r.soon b{color:#FF4D5E}
.newsalert{display:grid;gap:8px;text-decoration:none;color:var(--fg);border-color:color-mix(in srgb,#FF4D5E 35%,var(--line))}
.newsalert.res{border-color:var(--line)}.newsalert.res.up{border-color:var(--up)}.newsalert.res.dn{border-color:var(--down)}
.newsalert.near{border-color:#FF4D5E;background:color-mix(in srgb,#FF4D5E 8%,var(--bg2))}
.nt.nxt{color:#fff;background:#FF4D5E;border-radius:8px;padding:0 6px}.nt{font-weight:700;color:#FF6B78}
.rx{font-size:.85rem;margin-top:6px;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--fg) 5%,transparent)}.rx.against{background:color-mix(in srgb,#F2B705 14%,transparent)}.rx-w{color:#F2B705;font-weight:700;margin-top:2px}
.gp{position:relative;overflow:hidden;display:grid;gap:12px;padding:14px 16px 12px;border-radius:20px;background:linear-gradient(155deg,#1b2160 0%,#11154a 45%,#0b0e33 100%);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.gp::before{content:"";position:absolute;top:-70px;left:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(242,183,5,.22),transparent 70%);pointer-events:none}
.gp::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:box-shadow .5s}
.gp.flash-up::after{box-shadow:inset 0 0 0 2px rgba(61,214,140,.55),inset 0 0 30px rgba(61,214,140,.18)}
.gp.flash-dn::after{box-shadow:inset 0 0 0 2px rgba(255,107,107,.55),inset 0 0 30px rgba(255,107,107,.18)}
.gp-top{display:flex;align-items:center;gap:12px;position:relative}
.gp-logo{width:50px;height:50px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(242,183,5,.55),0 0 22px rgba(242,183,5,.35)}
.gp-id{display:grid;line-height:1.2;min-width:0}
.gp-sym{font-family:var(--latin);font-weight:800;font-size:1.2rem;letter-spacing:.6px;color:var(--fg)}
.gp-sub{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:flex-end}
.gp-live{width:7px;height:7px;border-radius:50%;background:var(--up);animation:gpPulse 1.8s infinite}
@keyframes gpPulse{0%{box-shadow:0 0 0 0 rgba(61,214,140,.6)}70%{box-shadow:0 0 0 8px rgba(61,214,140,0)}100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}}
.gp-px{margin-left:auto;text-align:right;display:grid;gap:2px}
.gp-p{font-family:var(--latin);font-weight:800;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--fg);transition:color .5s;white-space:nowrap}
.gp-p small{font-size:.72rem;color:var(--muted);font-weight:600;margin-left:5px}
.gp-p.tk-up{color:var(--up)}.gp-p.tk-dn{color:var(--down)}.gp-p{transition:color .35s}.gp-live.off{background:var(--down);animation:none}
.gp-ch{font-family:var(--latin);font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums;white-space:pre}
.gp-ch.up{color:var(--up)}.gp-ch.dn{color:var(--down)}
.gp-rng{display:grid;gap:6px;position:relative}
.gp-bar{position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(255,107,107,.6),rgba(242,183,5,.6),rgba(61,214,140,.6))}
.gp-dot{position:absolute;top:50%;left:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--gold);transform:translate(-50%,-50%);transition:left .8s;box-shadow:0 0 10px rgba(242,183,5,.6)}
.gp-lh{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mem{gap:8px}.mem-ph{cursor:pointer;font-size:.95rem}.mem-det{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.dn-sep{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.nrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.nrow .nt{min-width:46px;font-weight:700;color:#FF6B78}.nrow .nn{display:grid;gap:2px}.nrow.past{opacity:.6}.nrow.next .nt{color:#fff;background:#FF4D5E;border-radius:8px;padding:0 6px;align-self:flex-start}.nrow .soon-t{color:#FF6B78;font-weight:700}.nrow small.up{color:var(--up)}.nrow small.dn{color:var(--down)}
.news{display:grid;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--fg)}
.news b{font-size:1rem;line-height:1.55}.news .en{color:var(--muted);font-size:.75rem;line-height:1.4}
.tv.price{max-height:84px}
.btn.wa{background:#25D366;color:#fff;border-color:#25D366}
.btn.tg{background:#2AABEE;color:#fff;border-color:#2AABEE}
.renew{display:grid;gap:8px;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--bg2))}
.sess.on{border-color:var(--up)}
.sess .bar{height:6px;border-radius:999px;background:var(--bg);overflow:hidden}.sess .bar i{display:block;height:100%;background:var(--up)}
.lesson summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}.lesson summary::-webkit-details-marker{display:none}
.lesson p{margin:8px 0 0;line-height:1.8}
.pollbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--bg)}.pollbar .up{background:var(--up)}.pollbar .dn{background:var(--down)}
.poll{display:grid;gap:10px}
.lead summary{cursor:pointer;list-style:none}.lead summary::-webkit-details-marker{display:none}.lead .kv.me{color:var(--gold)}
.stars button{background:none;border:0;font-size:1.5rem;color:var(--line);cursor:pointer;padding:0 2px}.stars button.on{color:var(--gold)}
.views{font-size:.78rem;color:var(--muted);font-family:var(--latin)}
.sig-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sig-h .pair{font-family:var(--latin);font-weight:800;direction:ltr}
.sig-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.levels{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.levels dt{color:var(--muted)}
.levels dd{margin:0;text-align:end}
.sig img.chart{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.timeline{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.tl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:7px}
.tl small{color:var(--muted);font-size:.75rem}
.strength{display:inline-flex;gap:2px}
.strength b{width:6px;height:12px;border-radius:2px;background:var(--line)}
.strength b.f{background:var(--gold)}

.teaser{display:flex;align-items:center;gap:12px}
.ring{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 60%,transparent);animation:ring 1.8s infinite;flex:none}
@keyframes ring{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.blur{filter:blur(5px);user-select:none}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;min-height:50vh}
.bubble{max-width:80%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-start;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);border-end-start-radius:4px}
.bubble.them{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-end-end-radius:4px}
.bubble small{display:block;font-size:.68rem;opacity:.7;margin-top:2px}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.composer textarea{min-height:46px;height:46px}

.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
code.copy{display:block;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;font-family:var(--latin);direction:ltr;text-align:left;overflow-wrap:anywhere;user-select:all}

.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}

.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--up);color:#04210F;font-weight:600;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--down);color:#2A0505}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,6,20,.75);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--gold2);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.install{display:flex;gap:10px;align-items:center}
.install img{width:44px;height:44px;border-radius:10px}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== الرئيسية: الصفقة لايف + النتائج + المنشورات ===== */
.live .bigpl{font:800 2rem var(--latin);direction:ltr;unicode-bidi:isolate}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.chip.hit{background:color-mix(in srgb,var(--up) 20%,transparent);border-color:color-mix(in srgb,var(--up) 60%,transparent);color:var(--up);font-weight:600}
.chip.next{border-color:var(--gold);color:var(--gold)}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.lvl div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.lvl small{display:block;color:var(--muted);font-size:.72rem}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.strip small{display:block}
.wbl{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;direction:rtl;text-align:center}
.wbl div{display:flex;flex-direction:column;align-items:center;gap:0}
.wbl b{font-size:1.4rem;line-height:1.2}
.strip.today{padding-bottom:10px;border-bottom:1px dashed var(--line)}
.strip b{font:800 1.4rem var(--latin);direction:ltr;unicode-bidi:isolate}
.dots{display:flex;gap:6px;flex-wrap:wrap;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;display:inline-block}
.dots .w{background:var(--up)}.dots .wb{background:linear-gradient(90deg,var(--up) 50%,var(--muted) 50%)}.dots .b{background:var(--muted)}.dots .l{background:var(--down)}
.wbl.c4{grid-template-columns:repeat(4,1fr)}.legs{display:grid;gap:4px;font-size:.88rem}.legs div{display:flex;justify-content:space-between;gap:8px}
.ftabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--muted);cursor:pointer}
.ftabs button.on{background:color-mix(in srgb,var(--gold) 16%,transparent);border-color:var(--gold2);color:var(--gold);font-weight:600}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;color:var(--gold);padding:0;font-size:.85rem;cursor:pointer;align-self:flex-start}
.proof{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.proof:last-child{border-bottom:0}
.nofc{display:block;font-size:.72rem;line-height:1.4;color:var(--muted);padding-top:4px}
.backbtn{background:none;border:0;color:var(--gold);font-weight:600;font-size:.95rem;padding:4px 0 10px;cursor:pointer}
.pcard{padding:12px 14px;gap:8px}
.phead{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.ptitle{font-weight:600;line-height:1.5}
.pmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pmeta small{margin-inline-start:auto}
.pmeta{order:0}
.pprev{white-space:pre-wrap;color:var(--muted);font-size:.9rem;margin:0}
.pcard.open .pprev{color:var(--fg)}
.mapt{line-height:1.8;white-space:pre-wrap}.mapt .zone{cursor:pointer}.mapt .mx{font-size:.8rem;color:var(--muted);padding:0 18px 4px 0}.clamp6{max-height:11.5em;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmore{color:var(--gold);font-size:.85rem;font-weight:600}
.pill.newp{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.pcard.fresh{border-color:color-mix(in srgb,var(--up) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--up) 20%,transparent)}
.pbody{border-top:1px dashed var(--line);padding-top:8px}
.card.terms{border-color:color-mix(in srgb,var(--gold) 30%,var(--line))}
.ticon{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--bg2);font-size:.9rem}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;cursor:pointer;font-size:inherit}
.contact .foot{display:flex;justify-content:center;gap:8px;font-size:.78rem;color:var(--muted)}

/* 📈 الشارت */
.chx-top{display:flex;align-items:center;gap:10px}
.chx-top img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px rgba(242,183,5,.55)}
.chx-pxw{margin-inline-start:auto;text-align:left;direction:ltr;font-family:var(--latin)}
.chx-px{font-size:22px;font-weight:700}
.chx-chg{display:block;font-size:12px;font-weight:600}
.chx-bar{display:flex;gap:6px;flex-wrap:wrap}
.chx-bar button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;cursor:pointer}
.chx-bar button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.chx-card{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chx-ch{height:62vh;min-height:360px}
.chx-svg{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
.chx-ind{display:grid;gap:4px}
.chx-pnw{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chx-pn{height:110px}
.chx-pnl{position:absolute;top:4px;inset-inline-end:10px;z-index:2;font-size:12px;font-weight:600;color:var(--fg);background:rgba(16,18,58,.85);border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
.chx-tip{position:absolute;top:30px;inset-inline:10px;z-index:3;font-size:12.5px;line-height:1.7;background:rgba(16,18,58,.97);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.chx-sum{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.chx-sum small{color:var(--muted)}
.chx-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chx-chips span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.chx-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.06}
.chx-wm img{width:46%;max-width:300px}
.chx-lock{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(11,12,40,.96) 35%);text-align:center}
.chx-tg{position:absolute;left:10px;transform:translateY(-50%);z-index:3;border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.chx-tg.buy{background:var(--up);color:#062414}.chx-tg.sell{background:var(--down);color:#2a0606}
.chx-pop{position:absolute;left:10px;right:80px;top:12px;z-index:4;background:rgba(16,18,58,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.8;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.chx-pop b{display:block;margin-bottom:4px}.chx-pop .x{position:absolute;left:8px;top:6px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.chx-leg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.chx-leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.chx-ex{display:grid;gap:8px}
.chx-ex details{background:var(--bg2);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:8px 12px}
.chx-ex summary{cursor:pointer;font-weight:600;font-size:14px}
.chx-ex details div{font-size:13px;color:var(--muted);padding-top:4px}
.chx-note{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>

async function loadUser() {

  if (!(data || []).length) box.append(h("div", { class: "empty" }, "ما فيه طلبات نسخ."));
  (data || []).forEach(r => {
    const sel = h("select", { onchange: async e => { const { error: er } = await sb.from("copy_requests").update({ status: e.target.value }).eq("id", r.id); toast(er ? errText(er) : "تحدّث ✅", !!er); } });
    [["pending", "قيد المراجعة"], ["active", "فعّال"], ["stopped", "متوقف"], ["rejected", "مرفوض"]].forEach(o => sel.append(h("option", { value: o[0], selected: o[0] === r.status }, o[1])));
    box.append(h("div", { class: "card soft" }, h("div", { class: "between" }, h("b", null, (r.profiles && r.profiles.name) || "—"), h("small", { class: "muted" }, ago(r.created_at))),
      h("div", { class: "kv" }, h("span", null, "MT5"), h("b", { class: "num" }, r.mt5_login)), h("div", { class: "kv" }, h("span", null, "الوسيط"), h("b", null, r.broker || "—")), h("div", { class: "kv" }, h("span", null, "الرصيد"), h("b", { class: "num" }, r.balance ? "$" + fmt(r.balance) : "—")), sel));
  });
  return box;
}

/* ================== التحديث اللحظي والتنبيهات ================== */
let channel = null;
function notify(title, body, url) {
  toast(title);
  if (S.pushOn || !("Notification" in window) || Notification.permission !== "granted" || !document.hidden) return;
  navigator.serviceWorker && navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, icon: "icon-512.png", badge: "icon-512.png", data: { url } })).catch(() => {});
}
function subscribeLive() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("live")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "signals" }, p => { notify(S.member ? "توصية جديدة 📈" : "توصية جديدة للمشتركين", "افتح التطبيق", "./#signals"); refreshIf("home", "signals"); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "signals" }, () => refreshIf("home", "signals"))
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "signal_updates" }, p => { notify("تحديث على التوصية: " + (KIND[p.new.kind] || ""), p.new.body || "", "./#signals"); refreshIf("home", "signals"); })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" }, () => { notify("منشور جديد", "", "./#home"); refreshIf("home"); })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, p => {
      const mine = S.session && p.new.sender === S.session.user.id;
      if (!mine) { if (S.route !== "chat" && !S.admin) { S.unread++; renderChrome(); } notify("رسالة جديدة 💬", p.new.body, S.admin ? "./#admin/msgs/" + p.new.thread_user : "./#chat"); }
      refreshIf("chat"); if (S.admin && S.route === "admin" && location.hash.startsWith("#admin/msgs")) route();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "subscriptions" }, async p => {
      if (S.admin && p.eventType === "INSERT") { notify("طلب اشتراك جديد 💳", "", "./#admin/req"); if (S.route === "admin") route(); return; }
      if (!S.admin && p.new && p.new.status === "active") { await loadUser(); notify("تفعّل اشتراكك 🎉", "", "./#signals"); route(); }
      else if (!S.admin && p.new && p.new.status === "rejected") { toast("طلبك ما انقبل، شوف اشتراكي", true); refreshIf("sub"); }
    })
    .subscribe();
}

/* ================== التشغيل ================== */
async function boot() {
  await loadUser();
  subscribeLive();
  joinPresence();
  route();
  ensurePush();
}
let lastUid = undefined;
sb.auth.onAuthStateChange((ev, session) => {
  const uid = session ? session.user.id : null;
  if (lastUid === undefined) { lastUid = uid; return; }
  if (uid !== lastUid) { lastUid = uid; loadUser().then(() => { subscribeLive(); joinPresence(); route(); ensurePush(); }); }
});
// لمّا يرجع التطبيق من الخلفية نجدد الجلسة (الآيفون يوقف التجديد التلقائي)
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.session) sb.auth.refreshSession().then(() => loadUser()).then(() => route()).catch(() => {}); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
